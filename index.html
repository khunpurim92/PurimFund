<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FundPlan">
<meta name="theme-color" content="#0F0F14">
<title>FundPlan — ผู้ช่วยลงทุนกองทุน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
:root,[data-theme="dark"]{
  --bg:#0F0F14; --bg2:#17171E; --bg3:#20202A; --glass:rgba(15,15,20,.88);
  --card:#1B1B24; --card2:#24242F; --border:#30303E;
  --text:#F5F5FA; --text2:#C2C2D4; --text3:#9696AC;
  --accent:#7C6FF7; --accent2:#B3AAFB; --on-accent:#fff;
  --accent-bg:rgba(124,111,247,.14); --accent-line:rgba(124,111,247,.35); --accent-glow:rgba(124,111,247,.28);
  --green:#3EE0A6; --green-bg:rgba(62,224,166,.12);
  --amber:#FCC94A; --amber-bg:rgba(252,201,74,.12);
  --red:#FF8A8A; --red-bg:rgba(255,138,138,.12);
  --teal:#3ED8F2; --teal-bg:rgba(62,216,242,.12);
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#F3F3F8; --bg2:#FFFFFF; --bg3:#ECECF3; --glass:rgba(243,243,248,.9);
  --card:#FFFFFF; --card2:#F6F6FA; --border:#DCDCE6;
  --text:#14141B; --text2:#45455A; --text3:#66667A;
  --accent:#6556EE; --accent2:#4C3DD6; --on-accent:#fff;
  --accent-bg:rgba(101,86,238,.09); --accent-line:rgba(101,86,238,.3); --accent-glow:rgba(101,86,238,.22);
  --green:#087A50; --green-bg:rgba(8,122,80,.1);
  --amber:#9A6200; --amber-bg:rgba(214,150,20,.13);
  --red:#C81E1E; --red-bg:rgba(200,30,30,.08);
  --teal:#0A7A90; --teal-bg:rgba(10,122,144,.09);
  --shadow:0 6px 24px rgba(20,20,40,.08);
}
html,body{background:var(--bg);}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;color:var(--text);min-height:100vh;font-size:14px;line-height:1.5;}
#app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.scroll{flex:1;padding:14px 14px 104px;}
::-webkit-scrollbar{display:none;}
.num{font-variant-numeric:tabular-nums;}
button{font-family:inherit;}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;}
.topbar .tt{font-size:18px;font-weight:800;}
.topbar .ts{font-size:12px;color:var(--text2);}
.topbar .sp{flex:1;}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;}
.card.hero{background:linear-gradient(145deg,var(--card),var(--card2));box-shadow:0 0 0 1px var(--accent-line),var(--shadow);}
.lbl{font-size:12px;color:var(--text2);font-weight:700;letter-spacing:.3px;}
.sec{font-size:14px;font-weight:800;margin:20px 2px 10px;display:flex;align-items:center;gap:7px;}
.sec .more{margin-left:auto;font-size:12px;color:var(--accent2);font-weight:700;cursor:pointer;}
.muted{color:var(--text2);font-size:13px;}
.small{font-size:12px;color:var(--text2);}
.bigval{font-size:32px;font-weight:900;letter-spacing:-.5px;}
.up{color:var(--green);} .down{color:var(--red);}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;}
.chip.up{background:var(--green-bg);} .chip.down{background:var(--red-bg);}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:7px;background:var(--bg3);color:var(--text2);}
.tag.g{background:var(--green-bg);color:var(--green);} .tag.a{background:var(--amber-bg);color:var(--amber);}
.tag.r{background:var(--red-bg);color:var(--red);} .tag.p{background:var(--accent-bg);color:var(--accent2);} .tag.t{background:var(--teal-bg);color:var(--teal);}

.row{display:flex;gap:8px;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;transition:transform .12s;}
.btn:active{transform:scale(.97);}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px var(--accent-glow);}
.btn.gho{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
.btn.dan{background:var(--red-bg);color:var(--red);}
.btn.full{width:100%;}
.btn.flex{flex:1;}
.btn:disabled{opacity:.5;}
.mini{background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent2);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;cursor:pointer;}
.cost{font-size:11px;color:var(--text3);font-weight:600;}

/* banners & alerts */
.banner{padding:12px 14px;border-radius:14px;font-size:13px;font-weight:700;margin-bottom:12px;cursor:pointer;display:flex;gap:10px;align-items:center;}
.banner.warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bg);}
.banner.info{background:var(--accent-bg);color:var(--accent2);border:1px solid var(--accent-line);}
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;}
.alert .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:6px;}
.alert .at{font-size:13.5px;font-weight:700;}
.alert .as{font-size:12.5px;color:var(--text2);margin-top:2px;}

/* allocation */
.arow{margin-bottom:12px;} .arow:last-child{margin-bottom:0;}
.atop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;}
.aname{font-size:13.5px;font-weight:600;}
.apct{font-size:12.5px;color:var(--text2);font-weight:700;white-space:nowrap;}
.track{position:relative;height:8px;background:var(--bg3);border-radius:5px;}
.fill{position:absolute;left:0;top:0;height:100%;border-radius:5px;transition:width .4s;}
.tmark{position:absolute;top:-3px;width:2px;height:14px;background:var(--text);opacity:.7;border-radius:1px;}

/* rebalance */
.rb{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);}
.rb:first-child{border-top:none;}
.rb .rn{flex:1;font-size:13.5px;font-weight:600;}
.rb .rs{font-size:12px;color:var(--text2);}
.rb .rv{font-size:14px;font-weight:800;text-align:right;white-space:nowrap;}

/* holdings */
.hold{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--border);cursor:pointer;}
.hold:first-child{border-top:none;}
.fic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0;}
.hn{font-size:14px;font-weight:800;word-break:break-all;}
.hs{font-size:12px;color:var(--text2);margin-top:1px;}
.hv{font-size:14px;font-weight:800;text-align:right;white-space:nowrap;}
.hp{font-size:12px;font-weight:700;text-align:right;}

/* forms */
.f{margin-bottom:12px;flex:1;min-width:0;}
.fl{font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:700;}
input,select,textarea{width:100%;padding:12px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;outline:none;color:var(--text);-webkit-appearance:none;appearance:none;}
textarea{resize:none;line-height:1.5;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
input::placeholder,textarea::placeholder{color:var(--text3);}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--accent);-webkit-appearance:auto;appearance:auto;flex-shrink:0;}
.check{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--text2);cursor:pointer;}
.seg{display:flex;gap:4px;background:var(--bg3);padding:3px;border-radius:12px;border:1px solid var(--border);}
.seg button{flex:1;padding:9px 4px;border:none;border-radius:9px;background:none;color:var(--text2);font-weight:700;font-size:12.5px;cursor:pointer;}
.seg button.on{background:var(--accent);color:var(--on-accent);}
.err{font-size:12.5px;color:var(--red);font-weight:700;min-height:1px;}

/* AI box */
.ai{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:14px;padding:12px 14px;margin-top:10px;}
.ai .ail{font-size:12px;color:var(--accent2);font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.mdx{font-size:13.5px;line-height:1.7;color:var(--text);}
.mdx ul{padding-left:18px;margin:4px 0;} .mdx li{margin:2px 0;}
.mdx .mdh{font-weight:800;margin-top:8px;} .mdx .mdsp{height:6px;}
.mdx b{font-weight:800;}
.dots{display:flex;gap:5px;padding:6px 0;}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:bounce 1.2s infinite;}
.dots span:nth-child(2){animation-delay:.2s;}.dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}

/* check-up */
.verdict{font-size:20px;font-weight:900;}
.act{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);}
.act:first-child{border-top:none;}
.act .ai-ic{font-size:18px;flex-shrink:0;}
.act .an{font-size:13.5px;font-weight:800;}
.act .ar{font-size:12.5px;color:var(--text2);margin-top:2px;}

/* fund library */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.fgrid select{padding:10px 11px;font-size:13.5px;}
.frow{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--border);cursor:pointer;}
.frow:first-child{border-top:none;}
.ret{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px;margin:10px 0;}
.ret div{background:var(--bg3);border-radius:10px;padding:8px 4px;text-align:center;}
.ret .rl{font-size:11px;color:var(--text2);font-weight:700;}
.ret .rv2{font-size:15px;font-weight:900;}
details{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;margin-top:10px;}
details summary{font-size:13.5px;font-weight:800;cursor:pointer;list-style:none;}
details summary::-webkit-details-marker{display:none;}
details summary::after{content:" ▾";color:var(--text3);}
details[open] summary::after{content:" ▴";}
.sug{background:var(--card);border:1px solid var(--border);border-radius:12px;margin:-6px 0 12px;overflow:hidden;}
.sug div{padding:10px 12px;border-top:1px solid var(--border);cursor:pointer;font-size:13px;}
.sug div:first-child{border-top:none;}
.agent{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border);font-size:13px;}
.agent:first-child{border-top:none;}
.link{color:var(--accent2);font-weight:700;cursor:pointer;text-decoration:none;}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30;}
.nav button{flex:1;background:none;border:none;color:var(--text3);cursor:pointer;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nav button.on{color:var(--accent2);}
.nav .ni{font-size:21px;line-height:1.1;}
.nav .nl{font-size:11px;font-weight:800;}

/* empty / setup */
.empty{text-align:center;padding:26px 8px 8px;}
.empty .ei{font-size:46px;margin-bottom:10px;}
.empty .et{font-size:17px;font-weight:900;margin-bottom:6px;}
.empty .es{font-size:13.5px;color:var(--text2);line-height:1.65;}
.setup{padding:36px 18px 40px;}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;font-size:14px;color:var(--text);font-weight:600;margin-bottom:10px;cursor:pointer;}
.opt:active{border-color:var(--accent);}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet{width:100%;max-width:440px;background:var(--bg2);border-radius:22px 22px 0 0;border:1px solid var(--border);border-bottom:none;padding:16px 16px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:up .26s cubic-bezier(.16,1,.3,1);}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px;}
.sheet h3{font-size:18px;font-weight:900;margin-bottom:12px;}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 66px - 70px - env(safe-area-inset-top));height:calc(100dvh - 66px - 70px - env(safe-area-inset-top));}
.cbody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;}
.msg{display:flex;gap:8px;max-width:92%;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg .av{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--accent-bg);}
.bub{padding:11px 13px;border-radius:15px;font-size:14px;line-height:1.65;min-width:0;}
.msg.ai .bub{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:5px;}
.msg.user .bub{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px;white-space:pre-wrap;}
.msg .meta{font-size:11px;color:var(--text3);margin-top:6px;}
.qchips{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 10px;}
.qchip{background:var(--card);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:20px;cursor:pointer;}
.cbar{padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg2);}
.cin{display:flex;gap:8px;align-items:flex-end;}
.cin textarea{flex:1;max-height:110px;}
.send{width:46px;height:46px;border-radius:12px;background:var(--accent);border:none;color:var(--on-accent);font-size:19px;font-weight:900;cursor:pointer;flex-shrink:0;}
.send:disabled{opacity:.4;}
.stog{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;margin-bottom:8px;}
.stog.on{background:var(--teal-bg);color:var(--teal);border-color:var(--teal-bg);}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:700;padding:11px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:200;box-shadow:var(--shadow);max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.hr{height:1px;background:var(--border);margin:14px 0;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:13.5px;}
.kv:first-child{border-top:none;}
.kv span:first-child{color:var(--text2);}
.kv span:last-child{font-weight:700;text-align:right;}
.imp{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-img" accept="image/*" hidden>
<input type="file" id="file-json" accept="application/json,.json" hidden>

<script>
/* ════════════════════════════════════════════════════
   FundPlan v2 — ผู้ช่วยลงทุนกองทุน (single-file web app)
   ข้อมูลเก็บในเบราว์เซอร์ (localStorage) · AI ผ่าน Claude API
═══════════════════════════════════════════════════════ */

const MODEL="claude-sonnet-5-5";
const PRICE={in:2,out:10,search:0.01};   // USD ต่อ 1M token / ต่อการค้น 1 ครั้ง
const THB_RATE=35;                          // บาทต่อดอลลาร์ (ประมาณ)
const SEARCH_TOOL={type:"web_search_20250305",name:"web_search",max_uses:3};
const CACHE_DAYS=7, DRIFT=5, STALE_DAYS=45;

/* ── storage ── */
const LS={
  get(k,fb){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):fb;}catch{return fb;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.error(e);}},
  del(k){try{localStorage.removeItem(k);}catch{}}
};
const K={
  key:"fp_key",profile:"fp_profile",goals:"fp_goals",dca:"fp_dca",tax:"fp_tax",
  holdings:"fp2_holdings",info:"fp2_fundinfo",settings:"fp2_settings",usage:"fp2_usage",
  check:"fp2_check",chat:"fp2_chat",starter:"fp2_starter",migrated:"fp2_migrated"
};
const DEFAULT_SETTINGS={theme:"dark",budget:200,reviewMonths:6,lastReview:null,lossAlert:10,taxRate:10,chatSearch:false,checkSearch:false,myBrokers:[]};
const getSettings=()=>({...DEFAULT_SETTINGS,...LS.get(K.settings,{})});
const setSettings=p=>LS.set(K.settings,{...getSettings(),...p});

/* ── utils ── */
const baht=n=>(n<0?"-":"")+"฿"+Math.round(Math.abs(n)).toLocaleString("th-TH");
const bahtS=n=>(n>=0?"+":"-")+"฿"+Math.round(Math.abs(n)).toLocaleString("th-TH");
const pct=n=>(n>=0?"+":"")+(Math.round(n*10)/10).toFixed(1)+"%";
const num=v=>{const x=parseFloat(String(v==null?"":v).replace(/[,฿\s]/g,""));return isFinite(x)?x:0;};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const monthKey=()=>todayStr().slice(0,7);
const parseD=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);};
const daysSince=s=>s?Math.floor((parseD(todayStr())-parseD(s))/864e5):9999;
const addMonths=(s,m)=>{const d=parseD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d);};
const TH_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const fmtDate=s=>{if(!s)return"-";const d=parseD(s);return d.getDate()+" "+TH_M[d.getMonth()]+" "+String(d.getFullYear()+543).slice(2);};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=id=>document.getElementById(id);

/* ── asset classes & risk models ── */
const ASSET={
  th_equity:{label:"หุ้นไทย",color:"#7C6FF7"},
  global_equity:{label:"หุ้นต่างประเทศ",color:"#22C3E6"},
  bond:{label:"ตราสารหนี้",color:"#2FCB8E"},
  mixed:{label:"กองทุนผสม",color:"#E9A93A"},
  property:{label:"อสังหา/REIT",color:"#F07C7C"},
  commodity:{label:"ทองคำ/สินค้าโภคภัณฑ์",color:"#D98A1E"},
  moneymarket:{label:"ตลาดเงิน",color:"#8C8CA6"}
};
const ASSET_KEYS=Object.keys(ASSET);
const assetLabel=k=>ASSET[k]?ASSET[k].label:"อื่นๆ";
const assetColor=k=>ASSET[k]?ASSET[k].color:"#8C8CA6";

function costOf(u){
  const inTok=(u.input_tokens||0), outTok=(u.output_tokens||0), s=(u.searches||0);
  const usd=inTok*PRICE.in/1e6+outTok*PRICE.out/1e6+s*PRICE.search;
  return {usd,thb:usd*THB_RATE,searches:s,inTok,outTok};
}
function monthUsage(){const u=LS.get(K.usage,null);return u&&u.month===monthKey()?u:{month:monthKey(),thb:0,calls:0,searches:0};}
function addUsage(c){const u=monthUsage();u.thb+=c.thb;u.calls+=1;u.searches+=c.searches;LS.set(K.usage,u);}

function getKey(){return LS.get(K.key,"")||"";}
async function callClaude({system,messages,max_tokens=1500,search=false}){
  const key=getKey();
  if(!key)throw new Error("NO_KEY");
  const s=getSettings();
  if(s.budget>0&&monthUsage().thb>=s.budget)throw new Error("BUDGET");
  let msgs=messages.slice(), texts=[];
  const tot={input_tokens:0,output_tokens:0,searches:0};
  for(let round=0;round<4;round++){
    const body={model:MODEL,max_tokens,messages:msgs};
    if(system)body.system=system;
    if(search)body.tools=[SEARCH_TOOL];
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify(body)
    });
    if(!res.ok){const t=await res.text();throw new Error(res.status+":"+t.slice(0,300));}
    const data=await res.json();
    const u=data.usage||{};
    tot.input_tokens+=(u.input_tokens||0)+(u.cache_creation_input_tokens||0)+(u.cache_read_input_tokens||0);
    tot.output_tokens+=(u.output_tokens||0);
    tot.searches+=(u.server_tool_use&&u.server_tool_use.web_search_requests)||0;
    (data.content||[]).forEach(b=>{if(b.type==="text"&&b.text)texts.push(b.text);});
    if(data.stop_reason==="pause_turn"){msgs=msgs.concat([{role:"assistant",content:data.content}]);continue;}
    break;
  }
  const cost=costOf(tot);addUsage(cost);
  return {text:texts.join(""),cost};
}
function aiError(e){

  if(m.includes("NO_KEY"))return"🔑 ยังไม่ได้ใส่ Claude API key — ไปที่แท็บ ตั้งค่า";

  if(m.startsWith("429"))return"⏳ เรียกใช้ถี่เกินไปหรือเครดิตหมด ลองใหม่อีกครู่";

function extractJSON(txt){
  const tag=txt.match(/<JSON>([\s\S]*?)<\/JSON>/i);
  if(tag)txt=tag[1];
  const fence=txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence)txt=fence[1];
  const start=txt.search(/[{\[]/);
  if(start<0)throw new Error("no json");
  txt=txt.slice(start);
  let depth=0,end=0,inStr=false,escp=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(escp){escp=false;continue;}
    if(c==="\\"&&inStr){escp=true;continue;}
    if(c==='"')inStr=!inStr;
    if(!inStr){if(c==="{"||c==="[")depth++;else if(c==="}"||c==="]"){depth--;if(depth===0){end=i+1;break;}}}
  }
  return JSON.parse(end?txt.slice(0,end):txt);
}
function md(t){
  const lines=esc(String(t||"").replace(/<\/?JSON>/gi,"")).split("\n");
  const out=[];let inList=false;
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l))continue;
    const li=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if(li){if(!inList){out.push("<ul>");inList=true;}out.push("<li>"+li[1]+"</li>");continue;}
    if(inList){out.push("</ul>");inList=false;}
    const h=l.match(/^\s*#{1,5}\s+(.*)/);
    if(h){out.push('<div class="mdh">'+h[1]+"</div>");continue;}
    out.push(l.trim()?"<div>"+l+"</div>":'<div class="mdsp"></div>');
  }
  if(inList)out.push("</ul>");
  return out.join("");
}

function candidateList(assets,perClass=7){
  if(!FDB)return "";
  const mine=mineIdxSet();
  return assets.map(a=>{
    let L=FDB.funds.filter(f=>f.a===a&&!f.tax&&f.ter!=null&&f.r["1y"]!=null);
    if(mine.size){const m=L.filter(f=>f.sa.some(i=>mine.has(i)));if(m.length>=3)L=m;}
    L.sort((x,y)=>x.ter-y.ter);
    return `[${assetLabel(a)}]\n`+L.slice(0,perClass).map(f=>"- "+fundLine(f)).join("\n");
  }).join("\n");
}

function computePortfolio(){
  const items=getHoldings().map(h=>{const pl=h.value-h.invested;return {...h,pl,plPct:h.invested>0?pl/h.invested*100:0};});
  const totalValue=items.reduce((s,i)=>s+i.value,0);
  const totalInv=items.reduce((s,i)=>s+i.invested,0);
  const totalPL=totalValue-totalInv;
  const oldest=items.reduce((o,i)=>(!o||(i.updatedAt&&i.updatedAt<o))?i.updatedAt:o,null);
  return {items:items.sort((a,b)=>b.value-a.value),totalValue,totalInv,totalPL,totalPLPct:totalInv>0?totalPL/totalInv*100:0,oldest};
}
/* กองทุนผสมนับเป็นหุ้นไทย 50% + ตราสารหนี้ 50% เพื่อเทียบกับเป้าหมาย */
function effectiveAlloc(items){
  const m={};
  items.forEach(i=>{
    if(i.asset==="mixed"){m.th_equity=(m.th_equity||0)+i.value/2;m.bond=(m.bond||0)+i.value/2;}
    else m[i.asset]=(m[i.asset]||0)+i.value;
  });
  return m;
}
function rebalanceRows(extra=0){
  const port=computePortfolio(), tgt=targetAlloc(), cur=effectiveAlloc(port.items);
  const total=port.totalValue+extra;
  const keys=[...new Set([...Object.keys(tgt),...Object.keys(cur)])];
  const rows=keys.map(k=>{
    const c=cur[k]||0,t=tgt[k]||0,tv=total*t/100;
    return {asset:k,current:c,curPct:port.totalValue>0?c/port.totalValue*100:0,target:t,targetValue:tv,diff:tv-c,buy:0};
  });
  if(extra>0){
    const sum=rows.filter(r=>r.diff>0).reduce((s,r)=>s+r.diff,0);
    rows.forEach(r=>{r.buy=r.diff>0&&sum>0?extra*r.diff/sum:0;});
  }
  return rows.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
}
function nextReviewDate(){const s=getSettings();return addMonths(s.lastReview||todayStr(),s.lastReview?s.reviewMonths:0);}
function reviewDue(){const s=getSettings();if(!getHoldings().length)return false;if(!s.lastReview)return true;return todayStr()>=addMonths(s.lastReview,s.reviewMonths);}

function buildAlerts(){
  const port=computePortfolio(), s=getSettings(), out=[];
  if(!port.items.length)return out;
  rebalanceRows().forEach(r=>{
    const d=r.curPct-r.target;
    if(Math.abs(d)<DRIFT)return;
    if(d>0)out.push({c:"var(--amber)",t:`${assetLabel(r.asset)} เกินเป้า ${Math.round(d)}%`,s:`ถืออยู่ ${Math.round(r.curPct)}% เป้า ${r.target}% · ควรลดราว ${baht(-r.diff)}`});
    else out.push({c:"var(--teal)",t:`${assetLabel(r.asset)} ต่ำกว่าเป้า ${Math.round(-d)}%`,s:`ถืออยู่ ${Math.round(r.curPct)}% เป้า ${r.target}% · ควรเพิ่มราว ${baht(r.diff)}`});
  });
  port.items.forEach(i=>{if(i.invested>0&&i.plPct<=-s.lossAlert)out.push({c:"var(--red)",t:`${i.code} ขาดทุน ${Math.abs(Math.round(i.plPct))}%`,s:`เกินระดับเตือน ${s.lossAlert}% ที่ตั้งไว้ · ลองให้ AI ช่วยดูว่าควรถือต่อหรือไม่`});});
  if(port.oldest==="2000-01-01")out.push({c:"var(--amber)",t:"ตรวจมูลค่าพอร์ตอีกครั้ง",s:"ย้ายข้อมูลจากเวอร์ชันเดิมแล้ว แต่มูลค่าเดิมคำนวณจาก NAV ตัวอย่าง · กด ✏️ แก้มูลค่า หรือ 📸 อัปเดตจากภาพ"});
  else if(daysSince(port.oldest)>STALE_DAYS)out.push({c:"var(--text3)",t:"มูลค่าพอร์ตไม่ได้อัปเดตนาน",s:`บางกองอัปเดตล่าสุด ${fmtDate(port.oldest)} · แคปหน้าจอพอร์ตจากแอปธนาคารเพื่ออัปเดตได้`});
  const u=monthUsage();
  if(s.budget>0&&u.thb>=s.budget*0.8)out.push({c:"var(--amber)",t:"ค่า AI ใกล้ครบวงเงินเดือนนี้",s:`ใช้ไป ${baht(u.thb)} จาก ${baht(s.budget)}`});
  return out;
}

const TITLES={home:["พอร์ตของฉัน","ภาพรวมและการปรับสมดุล"],funds:["คลังกองทุน","ข้อมูลทั้งตลาดจาก ก.ล.ต."],ai:["ที่ปรึกษา AI","ถามได้ทุกเรื่องการลงทุน"],plan:["วางแผน","เป้าหมาย · DCA · ภาษี"],settings:["ตั้งค่า","API · ค่าใช้จ่าย · ข้อมูล"]};

function applyTheme(){
  const t=getSettings().theme;
  document.documentElement.setAttribute("data-theme",t);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="light"?"#F3F3F8":"#0F0F14";
}
function render(){
  applyTheme();
  const app=$("app");
  if(!getProfile()){app.innerHTML=`<div class="setup" id="setup"></div>`;renderSetup(0);return;}
  const[t,sub]=TITLES[state.tab];
  app.innerHTML=`
    <div class="topbar"><div><div class="tt">${t}</div><div class="ts">${sub}</div></div><div class="sp"></div>
      ${state.tab==="ai"?`<button class="iconbtn" title="ล้างแชท" onclick="clearChat()">🗑️</button>`:""}
      <button class="iconbtn" title="สลับธีม" onclick="toggleTheme()">${getSettings().theme==="light"?"🌙":"☀️"}</button>
    </div>
    ${state.tab==="ai"?viewAI():`<div class="scroll">${state.tab==="home"?viewHome():state.tab==="funds"?viewFunds():state.tab==="plan"?viewPlan():viewSettings()}</div>`}
    <div class="nav">${TABS.map(([id,ic,lb])=>`<button class="${state.tab===id?"on":""}" onclick="go('${id}')"><span class="ni">${ic}</span><span class="nl">${lb}</span></button>`).join("")}</div>`;
  if(state.tab==="ai")bindAI();
  if(state.tab==="home")bindHome();
  if(state.tab==="funds")bindFunds();
}
function go(tab){state.tab=tab;render();window.scrollTo(0,0);}
function toggleTheme(){setSettings({theme:getSettings().theme==="light"?"dark":"light"});render();}
function showSheet(html){closeSheet();const o=document.createElement("div");o.className="overlay";o.id="overlay";o.innerHTML=`<div class="sheet" id="sheet"><div class="handle"></div>${html}</div>`;o.addEventListener("click",e=>{if(e.target===o)closeSheet();});document.body.appendChild(o);}
function closeSheet(){const o=$("overlay");if(o)o.remove();}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2400);}
function downloadFile(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

const RISK_Q=[
  {q:"เป้าหมายหลักในการลงทุนของคุณคือ?",o:[["รักษาเงินต้น ไม่อยากขาดทุน",1],["ผลตอบแทนสม่ำเสมอ เสี่ยงได้นิดหน่อย",2],["เติบโตระยะยาว รับความผันผวนได้",3],["ผลตอบแทนสูงสุด รับความเสี่ยงสูงได้",4]]},
  {q:"ตั้งใจลงทุนนานแค่ไหน?",o:[["น้อยกว่า 1 ปี",1],["1–3 ปี",2],["3–7 ปี",3],["มากกว่า 7 ปี",4]]},

  {q:"ประสบการณ์ลงทุนของคุณ",o:[["ไม่เคยเลย เพิ่งเริ่ม",1],["เคยฝากประจำ/สลากออมทรัพย์",2],["เคยซื้อกองทุน/หุ้นมาบ้าง",3],["ลงทุนหลากหลายมาหลายปี",4]]}
];
let setupAns=[];
function renderSetup(step){
  const box=$("setup");
  const head=`<div style="text-align:center;margin-bottom:26px"><div style="font-size:50px">📈</div><div style="font-size:26px;font-weight:900">FundPlan</div><div class="muted" style="margin-top:6px">ผู้ช่วยลงทุนกองทุน ที่ให้ AI ช่วยดูพอร์ตและเตือนให้ปรับสมดุล</div></div>`;
  if(step<RISK_Q.length){
    const q=RISK_Q[step];
    box.innerHTML=head+`<div class="lbl" style="margin-bottom:8px">ประเมินความเสี่ยง · ข้อ ${step+1}/${RISK_Q.length}</div>
      <div class="track" style="margin-bottom:20px"><div class="fill" style="width:${step/RISK_Q.length*100}%;background:var(--accent)"></div></div>
      <div style="font-size:18px;font-weight:800;margin-bottom:16px">${q.q}</div>
      ${q.o.map((o,i)=>`<button class="opt" onclick="setupAns[${step}]=${o[1]};renderSetup(${step+1})">${o[0]}</button>`).join("")}
      ${step>0?`<button class="btn gho" onclick="renderSetup(${step-1})">← ย้อนกลับ</button>`:""}`;
    return;
  }
  const total=setupAns.reduce((a,b)=>a+b,0);
  const model=total<=6?"conservative":total<=10?"moderate":total<=13?"balanced":"aggressive";
  const tgt=MODELS[model];
  box.innerHTML=head+`<div class="lbl">ผลประเมิน</div>
    <div style="font-size:22px;font-weight:900;margin:4px 0 8px">โปรไฟล์ของคุณ: <span style="color:var(--accent2)">${MODEL_LABEL[model]}</span></div>
    <div class="muted" style="margin-bottom:14px">สัดส่วนนี้จะใช้เป็นเป้าหมาย เพื่อคำนวณว่าควรปรับพอร์ตเท่าไร</div>
    <div class="card">${Object.keys(tgt).map(k=>`<div class="arow"><div class="atop"><span class="aname">${assetLabel(k)}</span><span class="apct">${tgt[k]}%</span></div><div class="track"><div class="fill" style="width:${tgt[k]}%;background:${assetColor(k)}"></div></div></div>`).join("")}</div>
    <button class="btn pri full" onclick="finishSetup('${model}',${total})">เริ่มใช้งาน →</button>
    <button class="btn gho full" style="margin-top:8px" onclick="renderSetup(0)">ทำแบบประเมินใหม่</button>`;
}
function finishSetup(model,score){LS.set(K.profile,{model,score,createdAt:todayStr()});setupAns=[];state.tab="home";render();}

function viewAllocation(port){
  const eff=effectiveAlloc(port.items), tgt=targetAlloc();
  const keys=[...new Set([...Object.keys(tgt),...Object.keys(eff)])].sort((a,b)=>(eff[b]||0)-(eff[a]||0));
  const hasMixed=port.items.some(i=>i.asset==="mixed");
  return keys.map(k=>{
    const p=port.totalValue>0?(eff[k]||0)/port.totalValue*100:0, t=tgt[k]||0, d=p-t;
    const flag=Math.abs(d)>=DRIFT?` <span class="tag ${d>0?"a":"t"}">${d>0?"เกิน":"ขาด"} ${Math.round(Math.abs(d))}%</span>`:"";
    return `<div class="arow"><div class="atop"><span class="aname">${assetLabel(k)}${flag}</span><span class="apct">${Math.round(p)}% <span style="color:var(--text3);font-weight:600">/ ${t}%</span></span></div>
      <div class="track"><div class="fill" style="width:${Math.min(p,100)}%;background:${assetColor(k)}"></div>${t?`<div class="tmark" style="left:calc(${Math.min(t,100)}% - 1px)"></div>`:""}</div></div>`;
  }).join("")+`<div class="small" style="margin-top:12px">เส้นขีดแนวตั้ง = เป้าหมายของคุณ${hasMixed?" · กองทุนผสมนับเป็นหุ้นไทยและตราสารหนี้อย่างละครึ่ง":""}</div>`;
}
function viewRebalance(extra){
  const rows=rebalanceRows(extra||0), port=computePortfolio();
  const tol=Math.max(500,port.totalValue*0.01);
  if(extra>0){
    const buys=rows.filter(r=>r.buy>=1).sort((a,b)=>b.buy-a.buy);
    return `<div class="small" style="margin-bottom:6px">แบ่งเงิน ${baht(extra)} ไปเติมส่วนที่ขาด (ไม่ต้องขายของเดิม)</div>`+
      buys.map(r=>`<div class="rb"><div class="fic" style="width:34px;height:34px;font-size:13px;background:${assetColor(r.asset)}26;color:${assetColor(r.asset)}">＋</div><div class="rn">${assetLabel(r.asset)}<div class="rs">ยังขาดอีก ${baht(r.diff)}</div></div><div class="rv up">${baht(r.buy)}</div></div>`).join("")+
      `<div class="small" style="margin-top:8px">ให้ AI ช่วยเลือกกองที่จะซื้อได้ที่ปุ่มตรวจสุขภาพพอร์ต หรือถามในแท็บ ถาม AI</div>`;
  }
  const moves=rows.filter(r=>Math.abs(r.diff)>=tol);
  if(!moves.length)return `<div class="muted">✅ สัดส่วนใกล้เคียงเป้าหมายแล้ว ยังไม่ต้องปรับ</div>`;
  return `<div class="small" style="margin-bottom:6px">ถ้าจะปรับให้ตรงเป้าหมายด้วยการสับเปลี่ยน/ซื้อขาย</div>`+
    moves.map(r=>`<div class="rb"><div class="fic" style="width:34px;height:34px;font-size:13px;background:${assetColor(r.asset)}26;color:${assetColor(r.asset)}">${r.diff>0?"＋":"－"}</div><div class="rn">${assetLabel(r.asset)}<div class="rs">${Math.round(r.curPct)}% → ${r.target}%</div></div><div class="rv ${r.diff>0?"up":"down"}">${r.diff>0?"เพิ่ม":"ลด"} ${baht(Math.abs(r.diff))}</div></div>`).join("");
}

function viewCheckCard(){
  const chk=LS.get(K.check,null), s=getSettings();
  const controls=`<label class="check" style="margin-top:12px"><input type="checkbox" id="chk-search" ${s.checkSearch?"checked":""}> ค้นข้อมูลกองทุนล่าสุดจากเว็บ</label>
    <button class="btn pri full" style="margin-top:10px" id="chk-btn" onclick="runCheckup()">🩺 ${chk?"ตรวจอีกครั้ง":"ตรวจสุขภาพพอร์ต"}</button>
    <div class="cost" id="chk-cost" style="text-align:center;margin-top:5px">${s.checkSearch?"≈ ฿5–9 ต่อครั้ง":"≈ ฿0.5–1 ต่อครั้ง"}</div>

function viewCheckResult(chk){
  const r=chk.result||{};
  if(chk.raw)return `<div class="small">ตรวจเมื่อ ${fmtDate(chk.date)}</div><div class="mdx" style="margin-top:8px">${md(chk.raw)}</div>`;
  const vc=r.verdict==="ดี"?"var(--green)":r.verdict==="ควรปรับ"?"var(--amber)":"var(--teal)";
  const icon={"ซื้อเพิ่ม":"🟢","ลดสัดส่วน":"🟠","สับเปลี่ยน":"🔁","ถือต่อ":"⏸️"};
  return `<div style="display:flex;justify-content:space-between;align-items:center"><div class="verdict" style="color:${vc}">${esc(r.verdict||"-")}</div><div class="small">ตรวจเมื่อ ${fmtDate(chk.date)}${chk.searched?" · ค้นเว็บ":""}</div></div>
    <div class="mdx" style="margin-top:6px">${md(r.summary||"")}</div>
    ${(r.strengths||[]).length?`<div class="lbl" style="margin-top:12px">👍 จุดแข็ง</div><div class="mdx">${md(r.strengths.map(x=>"- "+x).join("\n"))}</div>`:""}
    ${(r.concerns||[]).length?`<div class="lbl" style="margin-top:10px">⚠️ ควรระวัง</div><div class="mdx">${md(r.concerns.map(x=>"- "+x).join("\n"))}</div>`:""}
    ${(r.actions||[]).length?`<div class="lbl" style="margin:12px 0 2px">✅ สิ่งที่แนะนำให้พิจารณา</div>${r.actions.map(a=>`<div class="act"><div class="ai-ic">${icon[a.type]||"•"}</div><div><div class="an">${esc(a.type||"")} ${esc(a.target||"")}${a.amount?` · ${baht(num(a.amount))}`:""}</div><div class="ar">${esc(a.reason||"")}</div></div></div>`).join("")}`:""}
    ${r.next?`<div class="small" style="margin-top:10px">🔭 ติดตาม: ${esc(r.next)}</div>`:""}
    ${chk.cost?`<div class="cost" style="margin-top:8px">${costTxt(chk.cost)}</div>`:""}`;
}
async function runCheckup(){
  const out=$("chk-out"), btn=$("chk-btn"), search=$("chk-search").checked;
  btn.disabled=true;out.innerHTML=loadingBox(search?"กำลังค้นข้อมูลและวิเคราะห์พอร์ต (อาจใช้เวลา 30–60 วินาที)...":"กำลังวิเคราะห์พอร์ต...");
  const sys=ADVISOR_BASE+(search?SEARCH_HINT:"")+`

งาน: ตรวจสุขภาพพอร์ต ประเมินความเหมาะสมกับโปรไฟล์ ความกระจุกตัว ค่าธรรมเนียม และแผนปรับสมดุลที่คำนวณไว้แล้ว
ตอบเป็น JSON ภายในแท็ก <JSON></JSON> เท่านั้น ไม่ต้องมีข้อความอื่น:
{"verdict":"ดี|พอใช้|ควรปรับ","summary":"สรุป 2-3 ประโยค","strengths":["สูงสุด 3 ข้อ"],"concerns":["สูงสุด 3 ข้อ"],"actions":[{"type":"ซื้อเพิ่ม|ลดสัดส่วน|สับเปลี่ยน|ถือต่อ","target":"รหัสกองทุนหรือประเภทสินทรัพย์ (ถ้าแนะนำกองใหม่ให้ใส่รหัสกองจริง)","amount":จำนวนบาทหรือnull,"reason":"เหตุผล 1 ประโยค"}],"next":"สิ่งที่ควรติดตามก่อนรอบตรวจถัดไป 1 ประโยค"}

/* กองที่ควรพิจารณาเติม: เลือกจากคลังสำหรับประเภทที่ยังขาด */
function checkupCandidates(){
  if(!FDB)return "";
  const under=rebalanceRows().filter(r=>r.diff>Math.max(1000,computePortfolio().totalValue*0.03)).map(r=>r.asset).filter(a=>ASSET[a]);
  if(!under.length)return "";
  return "\n\n[กองทุนจากคลัง ก.ล.ต. ที่อาจใช้เติมส่วนที่ขาด — ถ้าแนะนำกองใหม่ ให้เลือกจากรายชื่อนี้เป็นหลัก]\n"+candidateList(under,5);
}

function filterFunds(){
  const q=FSTATE.q.trim().toLowerCase(), mine=FSTATE.mine?mineIdxSet():null;
  let L=FDB.funds.filter(f=>{
    if(q&&!f.s.includes(q))return false;
    if(FSTATE.a!=="all"&&f.a!==FSTATE.a)return false;
    if(FSTATE.r!=="all"){const r=f.rs||0;if(FSTATE.r==="low"&&!(r>=1&&r<=3))return false;if(FSTATE.r==="mid"&&!(r>=4&&r<=5))return false;if(FSTATE.r==="high"&&r<6)return false;}
    if(FSTATE.t==="none"&&f.tax)return false;
    if(FSTATE.t!=="all"&&FSTATE.t!=="none"&&f.tax!==FSTATE.t)return false;
    if(mine&&mine.size&&!f.sa.some(i=>mine.has(i)))return false;
    return true;
  });
  const key={r1y:"1y",r3y:"3y",r5y:"5y"}[FSTATE.sort];
  if(key)L.sort((a,b)=>(b.r[key]??-1e9)-(a.r[key]??-1e9));
  else if(FSTATE.sort==="ter")L.sort((a,b)=>(a.ter??1e9)-(b.ter??1e9));
  else L.sort((a,b)=>a.c.localeCompare(b.c));
  if(q){const ex=L.filter(f=>f.c.toLowerCase()===q||f.cls.some(c=>c.toLowerCase()===q));if(ex.length)L=ex.concat(L.filter(f=>!ex.includes(f)));}
  return L;
}

  if(!L.length)return `<div class="card muted" style="text-align:center">ไม่พบกองทุนตามเงื่อนไขนี้</div>`;
  return `<div class="small" style="margin-bottom:6px">พบ ${L.length.toLocaleString()} กอง</div>
    <div class="card" style="padding:2px 14px">${L.slice(0,FSTATE.limit).map(f=>{
      const v=f.r[key], canBuy=mine.size&&f.sa.some(i=>mine.has(i));
      return `<div class="frow" onclick="showFundDB(${f.i})">
        <div class="fic" style="background:${assetColor(f.a)}26;color:${assetColor(f.a)}">${esc((f.c||"?")[0])}</div>

        <div style="text-align:right;flex-shrink:0"><div class="hv ${v==null?"":v>=0?"up":"down"}">${pctN(v)}</div><div class="hs">${key.replace("y"," ปี")}</div>${f.ter!=null?`<div class="hs">ค่าใช้จ่าย ${f.ter}%</div>`:""}</div>

    ${L.length>FSTATE.limit?`<button class="btn gho full" style="margin-top:8px" onclick="FSTATE.limit+=40;$('flist').innerHTML=renderFundList()">แสดงเพิ่ม (${(L.length-FSTATE.limit).toLocaleString()} กอง)</button>`:""}`;

function bindFunds(){
  const q=$("fq");if(!q)return;
  let t;
  q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{FSTATE.q=q.value;FSTATE.limit=40;$("flist").innerHTML=renderFundList();},180);};
  [["fa","a"],["fr","r"],["ft","t"],["fs","sort"]].forEach(([id,k])=>{$(id).onchange=e=>{FSTATE[k]=e.target.value;FSTATE.limit=40;$("flist").innerHTML=renderFundList();};});
  const m=$("fmine");if(m)m.onchange=()=>{FSTATE.mine=m.checked;FSTATE.limit=40;$("flist").innerHTML=renderFundList();};
}

async function lookupFund(code,force){

  const cached=infoOf(code);
  if(cached&&!force&&daysSince(cached.fetchedAt)<CACHE_DAYS)return {info:cached,cost:null,cached:true};
  const sys=`ค้นข้อมูลกองทุนรวมไทยจากเว็บ (เว็บไซต์ บลจ. ก.ล.ต. Finnomena Morningstar) ใช้การค้นไม่เกิน 2 ครั้ง

{"found":true|false,"code":"รหัสที่ถูกต้อง","name":"ชื่อกองทุน","amc":"บลจ.","asset":"คีย์ประเภท","risk":ระดับ1-8หรือnull,"fee":ค่าใช้จ่ายรวมต่อปี(%)หรือnull,"taxType":"SSF|RMF|ThaiESG|null","return1y":ผลตอบแทนย้อนหลัง1ปี(%)หรือnull,"asOf":"วันที่ของข้อมูลถ้าทราบ","summary":"นโยบายลงทุนสั้นๆ 1-2 ประโยค"}`;
  const {text,cost}=await callClaude({system:sys,max_tokens:1500,search:true,messages:[{role:"user",content:"กองทุนรหัส "+code}]});
  const j=extractJSON(text);
  if(!j.found)return {info:null,cost};
  const info={...j,code:String(j.code||code).toUpperCase(),asset:ASSET[j.asset]?j.asset:"mixed",taxType:j.taxType&&j.taxType!=="null"?j.taxType:null,fetchedAt:todayStr()};

  return {info,cost};

function fileToJpegB64(file,max=1568){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.88).split(",")[1]);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("อ่านไฟล์ภาพไม่ได้"));};
    img.src=url;
  });
}

function viewMsg(m){
  if(m.role==="user")return `<div class="msg user"><div class="bub">${esc(m.text)}</div></div>`;

function bindAI(){
  const inp=$("cin"),b=$("csend");
  inp.oninput=()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,110)+"px";};
  inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();chatSend(inp.value);}};
  b.onclick=()=>chatSend(inp.value);
  const c=$("cbody");c.scrollTop=c.scrollHeight;

function apiHistory(msgs){
  const h=[];
  msgs.filter(m=>!m.err).slice(-12).forEach(m=>{
    const role=m.role==="user"?"user":"assistant";
    if(h.length&&h[h.length-1].role===role)h[h.length-1].content+="\n\n"+m.text;else h.push({role,content:m.text});
  });
  while(h.length&&h[0].role!=="user")h.shift();
  return h;
}
async function chatSend(text,forceSearch){
  text=String(text||"").trim();if(!text||state.chatBusy)return;
  const search=forceSearch||getSettings().chatSearch;
  const msgs=getChat();msgs.push({role:"user",text});setChat(msgs);
  state.chatBusy=true;if(state.tab!=="ai")state.tab="ai";render();
  const sys=ADVISOR_BASE+(search?SEARCH_HINT:"\nตอนนี้ไม่ได้เปิดการค้นเว็บ ถ้าคำถามต้องใช้ข้อมูลล่าสุด (ราคา ข่าว ผลตอบแทนล่าสุด) ให้ตอบเท่าที่รู้พร้อมบอกว่าอาจไม่เป็นปัจจุบัน และแนะนำให้เปิดปุ่ม 🔎 ค้นเว็บ")+"\nตอบกระชับ ตรงประเด็น ใช้หัวข้อย่อยหรือ bullet เมื่อช่วยให้อ่านง่าย\n\n"+portfolioContext()+chatFundContext(text);
  try{
    const {text:reply,cost}=await callClaude({system:sys,max_tokens:search?2500:1500,search,messages:apiHistory(getChat())});
    const m=getChat();m.push({role:"ai",text:reply||"(ไม่มีคำตอบ)",cost});setChat(m);
  }catch(e){const m=getChat();m.push({role:"ai",text:aiError(e),err:true});setChat(m);}
  state.chatBusy=false;if(state.tab==="ai")render();
}
/* ถ้าคำถามพูดถึงรหัสกอง แนบข้อมูลจากคลัง ก.ล.ต. ให้ AI (ฟรี ไม่ต้องค้นเว็บ) */
function chatFundContext(text){
  if(!FDB)return "";
  const seen=new Set(), out=[];
  (String(text).match(/[A-Za-z][A-Za-z0-9&().\-]{1,30}/g)||[]).forEach(tok=>{
    const t=tok.replace(/[.)]+$/,"");
    const f=dbFund(t)||dbFund(tok);
    if(f&&!seen.has(f.id)&&out.length<6){seen.add(f.id);out.push("- "+fundLine(f));}
  });
  return out.length?"\n\n[ข้อมูลกองทุนที่ถูกถามถึง จากคลัง ก.ล.ต.]\n"+out.join("\n"):"";
}

function goalPlan(g){
  const model=(getProfile()||{}).model||"moderate",ret=RETURN_ASSUMP[model];
  const r=ret/100/12,n=Math.max(1,Math.round(g.years*12));
  const fvCur=(g.current||0)*Math.pow(1+r,n), need=g.target-fvCur;
  const pmt=need<=0?0:need*r/(Math.pow(1+r,n)-1);
  return {pmt,ret};
}

    <button class="btn gho full" onclick="setSettings({lossAlert:num($('set-loss').value)||10});toast('✅ บันทึกแล้ว')">บันทึก</button>
    <div class="small" style="margin-top:8px">แอปเตือนเมื่อสัดส่วนเบี่ยงจากเป้าเกิน ±${DRIFT}% ด้วย · แจ้งเตือนจะเห็นเมื่อเปิดแอป</div>
  </div>

  <div class="sec">🏦 ช่องทางซื้อกองทุนของฉัน</div>
  <div class="card">
    ${(s.myBrokers||[]).length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${s.myBrokers.map(n=>`<span class="tag p">${esc(n)}</span>`).join("")}</div>`:`<div class="muted" style="margin-bottom:10px">ยังไม่ได้ตั้ง — บอกว่ามีบัญชีกับธนาคาร/โบรกเกอร์ไหน แอปและ AI จะเลือกกองที่ซื้อผ่านช่องทางของคุณได้</div>`}
    <button class="btn gho full" onclick="showBrokerPicker()">${(s.myBrokers||[]).length?"แก้ไขช่องทาง":"＋ เลือกช่องทางของฉัน"}</button>
  </div>

  <div class="sec">🗂️ คลังกองทุน (ก.ล.ต.)</div>
  <div class="card">
    ${fdbState==="ok"?`<div class="kv"><span>จำนวนกองทุน</span><span>${FDB.funds.length.toLocaleString()} กอง</span></div><div class="kv"><span>ผู้สนับสนุนการขาย</span><span>${FDB.agents.length.toLocaleString()} ราย</span></div><div class="kv"><span>อัปเดตล่าสุด</span><span>${fmtDate((FDB.updated||"").slice(0,10))}</span></div>`
      :`<div class="muted">${fdbState==="missing"?"ยังไม่มีข้อมูล — รอระบบดึงข้อมูลรอบแรก":"กำลังโหลด..."}</div>`}
    <div class="small" style="margin-top:8px">อัปเดตอัตโนมัติวันที่ 2 ของทุกเดือน ผ่าน GitHub Actions · ไม่เสียค่า AI</div>
  </div>

  <div class="sec">👤 โปรไฟล์ความเสี่ยง</div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:16px;font-weight:900;color:var(--accent2)">${profileLabel()}</div><div class="small">ประเมินเมื่อ ${fmtDate(p.createdAt)}</div></div><button class="mini" onclick="if(confirm('ทำแบบประเมินความเสี่ยงใหม่?')){LS.del(K.profile);setupAns=[];render();}">ประเมินใหม่</button></div></div>

  <div class="sec">💾 สำรองและย้ายข้อมูล</div>
  <div class="card">
    <div class="muted" style="margin-bottom:10px">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ ส่งออกไฟล์ไว้เป็นระยะ และนำเข้าเพื่อย้ายไปมือถือ/คอมอีกเครื่อง (ไฟล์ไม่มี API key)</div>
    <div class="row"><button class="btn gho flex" onclick="exportData()">⬇️ ส่งออก</button><button class="btn gho flex" onclick="const f=$('file-json');f.value='';f.click()">⬆️ นำเข้า</button></div>
  </div>

  <div class="sec">ℹ️ เกี่ยวกับ</div>
  <div class="card"><div class="small" style="line-height:1.7"><b style="color:var(--text)">FundPlan</b> เป็นเครื่องมือติดตามและวางแผนพอร์ต ไม่ใช่ช่องทางซื้อขาย · ข้อมูลกองทุนในคลังมาจาก ก.ล.ต. (SEC Open Data) ส่วนข้อมูลที่ AI ค้นจากเว็บอาจคลาดเคลื่อน ควรตรวจกับหนังสือชี้ชวนหรือเว็บ บลจ. ก่อนตัดสินใจ<br><span style="color:var(--amber)">การลงทุนมีความเสี่ยง คำแนะนำจาก AI ใช้ประกอบการตัดสินใจเท่านั้น</span></div></div>
  <button class="btn dan full" onclick="resetAll()">🗑️ ล้างข้อมูลทั้งหมด</button>`;
}
function saveKey(){const k=$("api-key").value.trim();LS.set(K.key,k);render();toast(k?"✅ บันทึก API key แล้ว":"ลบ API key แล้ว");}
const BACKUP_KEYS=["profile","holdings","info","goals","dca","tax","settings","check","starter","chat"];
function exportData(){
  const data={};BACKUP_KEYS.forEach(k=>data[k]=LS.get(K[k],null));
  downloadFile("fundplan-backup-"+todayStr()+".json",JSON.stringify({app:"FundPlan",version:2,exportedAt:new Date().toISOString(),data},null,1),"application/json");
  toast("⬇️ ส่งออกแล้ว");
}
async function importData(file){
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=="FundPlan"||!j.data)throw new Error("ไม่ใช่ไฟล์สำรองของ FundPlan");
    if(!confirm("นำเข้าข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันในเครื่องจะถูกแทนที่"))return;
    BACKUP_KEYS.forEach(k=>{if(j.data[k]!=null)LS.set(K[k],j.data[k]);else LS.del(K[k]);});
    LS.set(K.migrated,true);state.tab="home";render();toast("✅ นำเข้าข้อมูลแล้ว");
  }catch(e){alert("นำเข้าไม่สำเร็จ: "+e.message);}
}
function resetAll(){
  if(!confirm("ล้างข้อมูลทั้งหมด? (ยกเว้น API key) แนะนำให้ส่งออกไฟล์สำรองก่อน"))return;
  BACKUP_KEYS.forEach(k=>LS.del(K[k]));LS.del(K.usage);["fp_holdings","fp_funds","fp_alertcfg","fp_dismissed"].forEach(k=>LS.del(k));
  LS.set(K.migrated,true);state={tab:"home",chatBusy:false,rbExtra:0};render();toast("ล้างข้อมูลแล้ว");
}
function downloadICS(){
  const d=nextReviewDate().replace(/-/g,""), now=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//FundPlan//TH","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:fundplan-review-"+d+"@fundplan","DTSTAMP:"+now,"DTSTART;VALUE=DATE:"+d,"SUMMARY:🩺 ตรวจสุขภาพพอร์ตกองทุน (FundPlan)","DESCRIPTION:เปิด FundPlan แล้วกด ตรวจสุขภาพพอร์ต","BEGIN:VALARM","TRIGGER:PT9H","ACTION:DISPLAY","DESCRIPTION:ถึงรอบตรวจพอร์ตกองทุนแล้ว","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  downloadFile("fundplan-review-"+nextReviewDate()+".ics",ics,"text/calendar");
  toast("📅 เปิดไฟล์เพื่อเพิ่มลงปฏิทิน");
}

/* ════════════ BOOT ════════════ */
$("file-img").addEventListener("change",e=>{const f=e.target.files[0];if(f)importScreenshot(f);});
$("file-json").addEventListener("change",e=>{const f=e.target.files[0];if(f)importData(f);});
migrate();
render();
loadFundDB();
</script>
