<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FundPlan">
<meta name="theme-color" content="#0A0F1E">
<title>FundPlan — ผู้ช่วยลงทุนกองทุน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
/* โทน "สมุดบัญชีธนาคาร": กรมท่าเข้ม + ทองเหลือง · ตัวเลขเป็นพระเอก */
:root,[data-theme="dark"]{
  --bg:#0A0F1E; --bg2:#0F1630; --bg3:#182140; --glass:rgba(10,15,30,.9);
  --card:#111931; --card2:#19234A; --border:#26315A;
  --text:#EEF1FA; --text2:#B7C0D9; --text3:#8893B3;
  --accent:#E2B659; --accent2:#EFCB7E; --on-accent:#1B1405;
  --accent-bg:rgba(226,182,89,.12); --accent-line:rgba(226,182,89,.34); --accent-glow:rgba(226,182,89,.18);
  --green:#3DDC97; --green-bg:rgba(61,220,151,.12);
  --amber:#FFA552; --amber-bg:rgba(255,165,82,.13);
  --red:#FF8080; --red-bg:rgba(255,128,128,.12);
  --teal:#6CC9FF; --teal-bg:rgba(108,201,255,.12);
  --hero:#16214C; --hero2:#101A3D; --hero-line:rgba(226,182,89,.38); --hero-text:#FFFFFF; --hero-sub:#B9C4E8; --hero-gold:#EFCB7E; --hero-btn:rgba(255,255,255,.09); --hero-btn-line:rgba(255,255,255,.16);
  --shadow:0 10px 30px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#F2F4F9; --bg2:#FFFFFF; --bg3:#EAEEF6; --glass:rgba(242,244,249,.92);
  --card:#FFFFFF; --card2:#F5F7FC; --border:#DCE1EE;
  --text:#0E1630; --text2:#434F6E; --text3:#667090;
  --accent:#1D3A8F; --accent2:#1D3A8F; --on-accent:#FFFFFF;
  --accent-bg:rgba(29,58,143,.07); --accent-line:rgba(29,58,143,.24); --accent-glow:rgba(29,58,143,.18);
  --green:#07794F; --green-bg:rgba(7,121,79,.09);
  --amber:#A45700; --amber-bg:rgba(200,120,10,.12);
  --red:#C62828; --red-bg:rgba(198,40,40,.08);
  --teal:#0B6AA2; --teal-bg:rgba(11,106,162,.09);
  --hero:#16214C; --hero2:#101A3D; --hero-line:rgba(226,182,89,.5);
  --shadow:0 8px 26px rgba(20,30,70,.09);
}
html,body{background:var(--bg);}
body{font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;color:var(--text);min-height:100vh;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;}
#app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.scroll{flex:1;padding:14px 16px 108px;}
::-webkit-scrollbar{display:none;}
.num{font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:11px;}
.brand{width:36px;height:36px;border-radius:11px;background:var(--hero);border:1px solid var(--hero-line);display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:8px 7px;flex-shrink:0;}
.brand i{display:block;width:4.5px;border-radius:1.5px;background:var(--hero-gold);}
.brand i:nth-child(1){height:7px;opacity:.55;}.brand i:nth-child(2){height:12px;opacity:.78;}.brand i:nth-child(3){height:18px;}
.topbar .tt{font-size:17px;font-weight:700;line-height:1.25;}
.topbar .ts{font-size:12px;color:var(--text3);line-height:1.3;}
.topbar .sp{flex:1;}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* cards & text */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;}
.lbl{font-size:12.5px;color:var(--text2);font-weight:600;}
.sec{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:9px;}
.sec .more{margin-left:auto;font-size:12.5px;color:var(--accent2);font-weight:600;cursor:pointer;}
.ic{width:28px;height:28px;border-radius:9px;background:linear-gradient(140deg,var(--accent-bg),var(--bg3));border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.muted{color:var(--text2);font-size:13.5px;}
.small{font-size:12.5px;color:var(--text2);}
.bigval{font-size:34px;font-weight:700;letter-spacing:-.6px;line-height:1.15;}
.up{color:var(--green);} .down{color:var(--red);}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;}
.chip.up{background:var(--green-bg);} .chip.down{background:var(--red-bg);}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg3);color:var(--text2);white-space:nowrap;}
.tag.g{background:var(--green-bg);color:var(--green);} .tag.a{background:var(--amber-bg);color:var(--amber);}
.tag.r{background:var(--red-bg);color:var(--red);} .tag.p{background:var(--accent-bg);color:var(--accent2);} .tag.t{background:var(--teal-bg);color:var(--teal);}

/* hero: หน้าปกสมุดบัญชี — กรมท่าทั้งสองธีม */
.card.hero{background:linear-gradient(160deg,var(--hero),var(--hero2));border:1px solid var(--hero-line);border-radius:20px;padding:18px 18px 16px;color:var(--hero-text,#fff);box-shadow:var(--shadow);}
.hero .lbl{color:var(--hero-sub,#B9C4E8);font-weight:500;}
.hero .bigval{color:#fff;}
.hero .small{color:var(--hero-sub,#B9C4E8);}
.hero .gold{color:var(--hero-gold,#EFCB7E);font-weight:600;}
.hero .up{color:#5BE7AE;} .hero .down{color:#FF9A9A;}
.hero .chip.up{background:rgba(91,231,174,.14);} .hero .chip.down{background:rgba(255,154,154,.14);}
.hero .btn.gho{background:var(--hero-btn,rgba(255,255,255,.09));border-color:var(--hero-btn-line,rgba(255,255,255,.16));color:#fff;white-space:nowrap;padding:11px 8px;font-size:13px;}
.hero .btn.gho:last-child{padding:11px 15px;}
.hstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);}
.hstats div{min-width:0;}
.hstats .k{font-size:11.5px;color:var(--hero-sub,#B9C4E8);}
.hstats .v{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;}
.gchart{margin:12px -4px 0;}
.gchart svg{display:block;width:100%;height:auto;}

/* home sub-tabs */
.htabs{display:flex;gap:4px;background:var(--bg3);padding:4px;border-radius:13px;margin-bottom:14px;}
.htabs button{flex:1;padding:9px 4px;border:none;border-radius:10px;background:none;color:var(--text2);font-weight:600;font-size:13px;cursor:pointer;position:relative;}
.htabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18);}
.htabs .dotn{position:absolute;top:6px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--amber);}

.row{display:flex;gap:8px;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.btn{border:none;border-radius:12px;padding:11px 15px;font-weight:600;font-size:13.5px;cursor:pointer;transition:transform .12s;line-height:1.35;}
.btn:active{transform:scale(.97);}
.btn.pri{background:var(--accent);color:var(--on-accent);}
.btn.gho{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
.btn.dan{background:var(--red-bg);color:var(--red);}
.btn.full{width:100%;}
.btn.flex{flex:1;}
.btn:disabled{opacity:.5;}
.mini{background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent2);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;}
.cost{font-size:11.5px;color:var(--text3);font-weight:500;}

/* banners & alerts */
.banner{padding:12px 14px;border-radius:13px;font-size:13.5px;font-weight:600;margin-bottom:12px;cursor:pointer;display:flex;gap:10px;align-items:center;}
.banner.warn{background:var(--amber-bg);color:var(--amber);}
.banner.info{background:var(--accent-bg);color:var(--accent2);border:1px solid var(--accent-line);}
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:13px;margin-bottom:8px;}
.alert .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:7px;}
.alert .at{font-size:14px;font-weight:600;}
.alert .as{font-size:12.5px;color:var(--text2);margin-top:1px;}

/* allocation */
.alloc{display:flex;gap:16px;align-items:center;margin-bottom:14px;}
.donut{width:118px;height:118px;flex-shrink:0;}
.donut text{font-family:inherit;}
.lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.lg div{display:flex;align-items:center;gap:7px;font-size:12.5px;}
.lg i{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.lg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);}
.lg b{font-weight:600;}
.arow{margin-bottom:12px;} .arow:last-child{margin-bottom:0;}
.atop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;}
.aname{font-size:13.5px;font-weight:500;}
.apct{font-size:12.5px;color:var(--text2);font-weight:600;white-space:nowrap;}
.track{position:relative;height:7px;background:var(--bg3);border-radius:4px;}
.fill{position:absolute;left:0;top:0;height:100%;border-radius:4px;transition:width .4s;}
.tmark{position:absolute;top:-3px;width:2px;height:13px;background:var(--text);opacity:.75;border-radius:1px;}

/* rebalance */
.rb{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);}
.rb:first-child{border-top:none;}
.rb .rn{flex:1;font-size:13.5px;font-weight:500;}
.rb .rs{font-size:12px;color:var(--text2);}
.rb .rv{font-size:14px;font-weight:700;text-align:right;white-space:nowrap;}

/* holdings / rows */
.hold{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);cursor:pointer;}
.hold:first-child{border-top:none;}
.fic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}
.hn{font-size:14px;font-weight:600;word-break:break-all;line-height:1.35;}
.hs{font-size:12px;color:var(--text2);margin-top:1px;}
.hv{font-size:14px;font-weight:700;text-align:right;white-space:nowrap;}
.hp{font-size:12px;font-weight:600;text-align:right;}
.wbar{height:3px;border-radius:2px;background:var(--bg3);margin-top:6px;overflow:hidden;}
.wbar i{display:block;height:100%;border-radius:2px;}

/* forms */
.f{margin-bottom:12px;flex:1;min-width:0;}
.fl{font-size:12.5px;color:var(--text2);margin-bottom:6px;font-weight:600;}
input,select,textarea{width:100%;padding:12px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;outline:none;color:var(--text);-webkit-appearance:none;appearance:none;}
select{background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px;}
textarea{resize:none;line-height:1.5;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
input::placeholder,textarea::placeholder{color:var(--text3);}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--accent);-webkit-appearance:auto;appearance:auto;flex-shrink:0;}
.check{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--text2);cursor:pointer;}
.seg{display:flex;gap:4px;background:var(--bg3);padding:3px;border-radius:12px;border:1px solid var(--border);}
.seg button{flex:1;padding:9px 4px;border:none;border-radius:9px;background:none;color:var(--text2);font-weight:600;font-size:13px;cursor:pointer;}
.seg button.on{background:var(--accent);color:var(--on-accent);}
.err{font-size:12.5px;color:var(--red);font-weight:600;min-height:1px;}

/* AI box */
.ai{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:13px;padding:12px 14px;margin-top:10px;}
.ai .ail{font-size:12.5px;color:var(--accent2);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.mdx{font-size:14px;line-height:1.7;color:var(--text);}
.mdx ul{padding-left:18px;margin:4px 0;} .mdx li{margin:2px 0;}
.mdx .mdh{font-weight:700;margin-top:8px;} .mdx .mdsp{height:6px;}
.mdx b{font-weight:600;}
.dots{display:flex;gap:5px;padding:6px 0;}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:bounce 1.2s infinite;}
.dots span:nth-child(2){animation-delay:.2s;}.dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}

/* check-up */
.verdict{font-size:20px;font-weight:700;}
.act{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);}
.act:first-child{border-top:none;}
.act .ai-ic{font-size:17px;flex-shrink:0;}
.act .an{font-size:14px;font-weight:600;}
.act .ar{font-size:12.5px;color:var(--text2);margin-top:2px;}
.score{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.score .ring{width:64px;height:64px;flex-shrink:0;}
.score .st{font-size:17px;font-weight:700;line-height:1.3;}
.chk{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border);align-items:flex-start;}
.chk .ci{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;margin-top:1px;}
.chk .ci.ok{background:var(--green-bg);color:var(--green);} .chk .ci.no{background:var(--amber-bg);color:var(--amber);} .chk .ci.na{background:var(--bg3);color:var(--text3);}
.chk .ct{font-size:14px;font-weight:600;}
.chk .cd{font-size:12.5px;color:var(--text2);margin-top:1px;}

/* fund library */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.fgrid select{padding:10px 30px 10px 11px;font-size:13.5px;}
.frow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);cursor:pointer;}
.frow:first-child{border-top:none;}
.cmpt{cursor:pointer;border:1px dashed var(--border);background:none;}
.cmpt.p{border-style:solid;border-color:var(--accent-line);background:var(--accent-bg);}
.cmpbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:412px;background:var(--hero);border:1px solid var(--hero-line);color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:25;box-shadow:var(--shadow);font-size:13.5px;font-weight:600;}
.cmpbar .sp{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmpbar button{border:none;border-radius:9px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;}
.cmpbar .go{background:var(--hero-gold,#EFCB7E);color:#1B1405;} .cmpbar .cl{background:rgba(255,255,255,.12);color:#fff;}
.ctw{overflow-x:auto;margin:0 -16px;padding:0 16px;}
.ctab{border-collapse:collapse;font-size:12.5px;min-width:100%;}
.ctab th,.ctab td{padding:9px 7px;border-top:1px solid var(--border);text-align:right;white-space:nowrap;}
.ctab th{font-weight:600;vertical-align:bottom;border-top:none;font-size:12.5px;max-width:92px;white-space:normal;word-break:break-all;line-height:1.3;}
.ctab td:first-child,.ctab th:first-child{text-align:left;color:var(--text2);position:sticky;left:-16px;background:var(--bg2);padding-left:16px;font-weight:500;max-width:112px;white-space:normal;line-height:1.35;}
.ctab td.best{font-weight:700;color:var(--accent2);background:var(--accent-bg);}
.ctab tr.grp td{font-size:11.5px;color:var(--text3);font-weight:600;padding-top:14px;border-top:none;}
details{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 14px;margin-top:10px;}
details summary{font-size:13.5px;font-weight:600;cursor:pointer;list-style:none;}
details summary::-webkit-details-marker{display:none;}
details summary::after{content:" ▾";color:var(--text3);}
details[open] summary::after{content:" ▴";}
.sug{background:var(--card);border:1px solid var(--border);border-radius:12px;margin:-6px 0 12px;overflow:hidden;}
.sug div{padding:10px 12px;border-top:1px solid var(--border);cursor:pointer;font-size:13px;}
.sug div:first-child{border-top:none;}
.agent{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border);font-size:13px;}
.agent:first-child{border-top:none;}
.link{color:var(--accent2);font-weight:600;cursor:pointer;text-decoration:none;}
.ptab{width:100%;border-collapse:collapse;font-size:13px;}
.ptab th{font-size:12px;color:var(--text2);font-weight:600;text-align:right;padding:6px 4px;}
.ptab td{text-align:right;padding:7px 4px;border-top:1px solid var(--border);white-space:nowrap;}
.ptab td:first-child,.ptab th:first-child{text-align:left;color:var(--text2);font-weight:500;}

/* transactions */
.txrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border);}
.txrow:first-child{border-top:none;}
.txi{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.txi.buy{background:var(--green-bg);color:var(--green);} .txi.sell{background:var(--red-bg);color:var(--red);} .txi.open{background:var(--bg3);color:var(--text2);}

/* goals */
.range{position:relative;height:26px;margin:12px 0 4px;}
.range .rt{position:absolute;left:0;right:0;top:10px;height:6px;border-radius:3px;background:var(--bg3);}
.range .rf{position:absolute;top:10px;height:6px;border-radius:3px;background:var(--accent);opacity:.55;}
.range .rm{position:absolute;top:5px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--card);margin-left:-8px;}
.range .rg{position:absolute;top:0;bottom:0;width:2px;background:var(--text);margin-left:-1px;border-radius:1px;}
.rleg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;}
.rleg div{background:var(--bg3);border-radius:10px;padding:7px 9px;min-width:0;}
.rleg .k{font-size:11.5px;color:var(--text2);} .rleg .v{font-size:13.5px;font-weight:600;white-space:nowrap;}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--border);display:flex;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:30;}
.nav button{flex:1;background:none;border:none;color:var(--text3);cursor:pointer;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.nav .ni{font-size:18px;line-height:1;width:46px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;filter:grayscale(.75);opacity:.8;transition:background .2s;}
.nav button.on .ni{background:var(--accent-bg);filter:none;opacity:1;}

/* sheet */

<script>
/* ════════════════════════════════════════════════════
   FundPlan v3 — ผู้ช่วยลงทุนกองทุน (single-file web app)
   ข้อมูลเก็บในเบราว์เซอร์ (localStorage) · AI ผ่าน Claude API
═══════════════════════════════════════════════════════ */

const MODEL="claude-sonnet-5-5";
const PRICE={in:2,out:10,search:0.01};   // USD ต่อ 1M token / ต่อการค้น 1 ครั้ง
const THB_RATE=35;                          // บาทต่อดอลลาร์ (ประมาณ)
const SEARCH_TOOL={type:"web_search_20250305",name:"web_search",max_uses:3};
const CACHE_DAYS=7, DRIFT=5, STALE_DAYS=45;

/* ── storage ── */
const LS={
  get(k,fb){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):fb;}catch{return fb;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.error(e);}},
  del(k){try{localStorage.removeItem(k);}catch{}}
};
const K={
  key:"fp_key",profile:"fp_profile",goals:"fp_goals",dca:"fp_dca",tax:"fp_tax",
  holdings:"fp2_holdings",info:"fp2_fundinfo",settings:"fp2_settings",usage:"fp2_usage",
  check:"fp2_check",chat:"fp2_chat",starter:"fp2_starter",migrated:"fp2_migrated",sellers:"fp2_sellers",tx:"fp3_tx",hist:"fp3_hist"
};
const DEFAULT_SETTINGS={theme:"dark",budget:200,reviewMonths:6,lastReview:null,lossAlert:10,taxRate:10,chatSearch:false,checkSearch:false,myBrokers:[],income:0};
const getSettings=()=>({...DEFAULT_SETTINGS,...LS.get(K.settings,{})});
const setSettings=p=>LS.set(K.settings,{...getSettings(),...p});

/* ── utils ── */
const baht=n=>(n<0?"-":"")+"฿"+Math.round(Math.abs(n)).toLocaleString("th-TH");
const bahtS=n=>(n>=0?"+":"-")+"฿"+Math.round(Math.abs(n)).toLocaleString("th-TH");
const bahtC=n=>Math.abs(n)>=1e6?"฿"+(n/1e6).toFixed(2)+" ล้าน":baht(n);
const pct=n=>(n>=0?"+":"")+(Math.round(n*10)/10).toFixed(1)+"%";
const num=v=>{const x=parseFloat(String(v==null?"":v).replace(/[,฿\s]/g,""));return isFinite(x)?x:0;};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const monthKey=()=>todayStr().slice(0,7);
const parseD=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);};
const daysSince=s=>s?Math.floor((parseD(todayStr())-parseD(s))/864e5):9999;
const addMonths=(s,m)=>{const d=parseD(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d);};
const TH_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const fmtDate=s=>{if(!s)return"-";const d=parseD(s);return d.getDate()+" "+TH_M[d.getMonth()]+" "+String(d.getFullYear()+543).slice(2);};
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=id=>document.getElementById(id);

/* ── asset classes & risk models ── */
const ASSET={
  th_equity:{label:"หุ้นไทย",color:"#7C6FF7"},
  global_equity:{label:"หุ้นต่างประเทศ",color:"#22C3E6"},
  bond:{label:"ตราสารหนี้",color:"#2FCB8E"},
  mixed:{label:"กองทุนผสม",color:"#E9A93A"},
  property:{label:"อสังหา/REIT",color:"#F07C7C"},
  commodity:{label:"ทองคำ/สินค้าโภคภัณฑ์",color:"#D98A1E"},
  moneymarket:{label:"ตลาดเงิน",color:"#8C8CA6"}
};
const ASSET_KEYS=Object.keys(ASSET);
const assetLabel=k=>ASSET[k]?ASSET[k].label:"อื่นๆ";
const assetColor=k=>ASSET[k]?ASSET[k].color:"#8C8CA6";
const ASSET_GUIDE="th_equity=หุ้นไทย, global_equity=หุ้นต่างประเทศ, bond=ตราสารหนี้, mixed=กองทุนผสม, property=อสังหา/REIT/โครงสร้างพื้นฐาน, commodity=ทองคำ/น้ำมัน/สินค้าโภคภัณฑ์, moneymarket=ตลาดเงิน";
const MODELS={
  conservative:{th_equity:15,global_equity:10,bond:55,moneymarket:20},
  moderate:{th_equity:25,global_equity:20,bond:35,commodity:5,moneymarket:15},
  balanced:{th_equity:30,global_equity:25,bond:30,commodity:5,property:5,moneymarket:5},
  aggressive:{th_equity:35,global_equity:35,bond:15,commodity:5,property:10}
};
const MODEL_LABEL={conservative:"ระมัดระวัง",moderate:"ปานกลาง",balanced:"สมดุล",aggressive:"เชิงรุก"};
const RETURN_ASSUMP={conservative:3,moderate:4.5,balanced:5.5,aggressive:7};
const getProfile=()=>LS.get(K.profile,null);
const targetAlloc=()=>MODELS[(getProfile()||{}).model]||MODELS.moderate;
const profileLabel=()=>MODEL_LABEL[(getProfile()||{}).model]||"ปานกลาง";

/* ════════════ USAGE / COST ════════════ */
function costOf(u){
  const inTok=(u.input_tokens||0), outTok=(u.output_tokens||0), s=(u.searches||0);
  const usd=inTok*PRICE.in/1e6+outTok*PRICE.out/1e6+s*PRICE.search;
  return {usd,thb:usd*THB_RATE,searches:s,inTok,outTok};
}
function monthUsage(){const u=LS.get(K.usage,null);return u&&u.month===monthKey()?u:{month:monthKey(),thb:0,calls:0,searches:0};}
function addUsage(c){const u=monthUsage();u.thb+=c.thb;u.calls+=1;u.searches+=c.searches;LS.set(K.usage,u);}
const costTxt=c=>c?("≈ ฿"+(c.thb<1?c.thb.toFixed(2):c.thb.toFixed(1))+(c.searches?" · ค้นเว็บ "+c.searches+" ครั้ง":"")):"";

/* ════════════ CLAUDE API ════════════ */
function getKey(){return LS.get(K.key,"")||"";}
async function callClaude({system,messages,max_tokens=1500,search=false}){
  const key=getKey();
  if(!key)throw new Error("NO_KEY");
  const s=getSettings();
  if(s.budget>0&&monthUsage().thb>=s.budget)throw new Error("BUDGET");
  let msgs=messages.slice(), texts=[];
  const tot={input_tokens:0,output_tokens:0,searches:0};
  for(let round=0;round<4;round++){
    const body={model:MODEL,max_tokens,messages:msgs};
    if(system)body.system=system;
    if(search)body.tools=[SEARCH_TOOL];
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify(body)
    });
    if(!res.ok){const t=await res.text();throw new Error(res.status+":"+t.slice(0,300));}
    const data=await res.json();
    const u=data.usage||{};
    tot.input_tokens+=(u.input_tokens||0)+(u.cache_creation_input_tokens||0)+(u.cache_read_input_tokens||0);
    tot.output_tokens+=(u.output_tokens||0);
    tot.searches+=(u.server_tool_use&&u.server_tool_use.web_search_requests)||0;
    (data.content||[]).forEach(b=>{if(b.type==="text"&&b.text)texts.push(b.text);});
    if(data.stop_reason==="pause_turn"){msgs=msgs.concat([{role:"assistant",content:data.content}]);continue;}
    break;
  }
  const cost=costOf(tot);addUsage(cost);
  return {text:texts.join(""),cost};
}
function aiError(e){
  const m=String((e&&e.message)||e);
  if(m.includes("NO_KEY"))return"🔑 ยังไม่ได้ใส่ Claude API key — ไปที่แท็บ ตั้งค่า";
  if(m.includes("BUDGET"))return"💸 ใช้ครบวงเงินที่ตั้งไว้ของเดือนนี้แล้ว — ปรับวงเงินได้ที่แท็บ ตั้งค่า";
  if(m.startsWith("401"))return"🔑 API key ไม่ถูกต้อง ตรวจที่แท็บ ตั้งค่า";
  if(m.startsWith("429"))return"⏳ เรียกใช้ถี่เกินไปหรือเครดิตหมด ลองใหม่อีกครู่";
  if(m.startsWith("529")||m.startsWith("503"))return"⏳ ระบบ AI ใช้งานหนักอยู่ ลองใหม่อีกครู่";
  if(m.startsWith("400")&&/web_search|tool/i.test(m))return"🔎 การค้นเว็บใช้ไม่ได้ — อาจต้องเปิดสิทธิ์ Web search ใน Claude Console ก่อน หรือปิดการค้นเว็บแล้วลองใหม่";
  if(m.startsWith("400")&&/credit|balance/i.test(m))return"💳 เครดิต API ไม่พอ เติมได้ที่ Claude Console";
  if(m.startsWith("400"))return"⚠️ คำขอผิดพลาด: "+m.slice(4,140);
  if(/Failed to fetch|NetworkError/i.test(m))return"📶 เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่";
  return"⚠️ เกิดข้อผิดพลาด: "+m.slice(0,120);
}
function extractJSON(txt){
  const tag=txt.match(/<JSON>([\s\S]*?)<\/JSON>/i);
  if(tag)txt=tag[1];
  const fence=txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence)txt=fence[1];
  const start=txt.search(/[{\[]/);
  if(start<0)throw new Error("no json");
  txt=txt.slice(start);
  let depth=0,end=0,inStr=false,escp=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(escp){escp=false;continue;}
    if(c==="\\"&&inStr){escp=true;continue;}
    if(c==='"')inStr=!inStr;
    if(!inStr){if(c==="{"||c==="[")depth++;else if(c==="}"||c==="]"){depth--;if(depth===0){end=i+1;break;}}}
  }
  return JSON.parse(end?txt.slice(0,end):txt);
}
function md(t){
  const lines=esc(String(t||"").replace(/<\/?JSON>/gi,"")).split("\n");
  const out=[];let inList=false;
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l))continue;
    const li=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if(li){if(!inList){out.push("<ul>");inList=true;}out.push("<li>"+li[1]+"</li>");continue;}
    if(inList){out.push("</ul>");inList=false;}
    const h=l.match(/^\s*#{1,5}\s+(.*)/);
    if(h){out.push('<div class="mdh">'+h[1]+"</div>");continue;}
    out.push(l.trim()?"<div>"+l+"</div>":'<div class="mdsp"></div>');
  }
  if(inList)out.push("</ul>");
  return out.join("");
}
const loadingBox=t=>`<div class="ai"><div class="ail">🤖 ${t}</div><div class="dots"><span></span><span></span><span></span></div></div>`;
const errBox=e=>`<div class="ai"><div class="mdx">${esc(aiError(e))}</div></div>`;

/* ════════════ HOLDINGS & PORTFOLIO ════════════ */
const getHoldings=()=>LS.get(K.holdings,[]);
const setHoldings=h=>{LS.set(K.holdings,h);recordSnapshot();};
const getInfo=()=>LS.get(K.info,{});
const infoOf=code=>dbInfo(code)||getInfo()[String(code||"").toUpperCase()]||null;

/* ════════════ คลังกองทุน (ข้อมูล ก.ล.ต. ใน data/funds.json) ════════════ */
let FDB=null, fdbState="idle";
const TAXRE=/SSF|RMF|ESG|LTF/i;
async function loadFundDB(){
  if(fdbState==="ok"||fdbState==="loading")return FDB;
  fdbState="loading";
  try{
    const r=await fetch("data/funds.json",{cache:"no-cache"});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const byKey=new Map(), cnt=new Array(j.agents.length).fill(0);
    j.funds.forEach((f,i)=>{
      f.i=i;f.r=f.r||{};f.b=f.b||{};f.pg=f.pg||{};f.sd=f.sd||{};f.cal=f.cal||{};f.bcal=f.bcal||{};f.cls=f.cls||[];f.sa=f.sa||[];f.ff=f.ff||[];if(!(f.ter>0))f.ter=null;
      if(f.tax&&!TAXRE.test(f.c)&&f.cls.some(c=>TAXRE.test(c))&&f.cls.some(c=>!TAXRE.test(c))){f.taxCls=f.tax;f.tax=null;}
      f.s=(f.c+" "+f.th+" "+f.en+" "+f.amc+" "+f.cls.join(" ")).toLowerCase();
      [f.c,...f.cls].forEach(k=>{if(k&&!byKey.has(k.toUpperCase()))byKey.set(k.toUpperCase(),f);});
      f.sa.forEach(a=>cnt[a]++);
    });
    FDB={updated:j.updated,agents:j.agents,agentCount:cnt,funds:j.funds,byKey};
    fdbState="ok";
  }catch(e){fdbState="missing";}
  if(["funds","settings"].includes(state.tab)&&!$("overlay"))render();
  return FDB;
}
const dbFund=code=>FDB?FDB.byKey.get(String(code||"").trim().toUpperCase())||null:null;
const fAsset=f=>ASSET[f.a]?f.a:"mixed";
const riskTxt=r=>r?(r>8?"8+":String(Math.floor(r))):"-";
const pctN=v=>v==null?"-":(v>0?"+":"")+v.toFixed(1)+"%";
function mineIdxSet(){const m=getSettings().myBrokers||[];return FDB?new Set(m.map(n=>FDB.agents.indexOf(n)).filter(i=>i>=0)):new Set();}
function myAgentsFor(f){const s=mineIdxSet();return f.sa.filter(i=>s.has(i)).map(i=>FDB.agents[i]);}
function dbInfo(code){
  const f=dbFund(code);if(!f)return null;
  return {found:true,code:f.c,name:f.th||f.en,amc:f.amc,asset:fAsset(f),risk:f.rs?riskTxt(f.rs):null,fee:f.ter??f.mf??null,return1y:f.r["1y"]??null,taxType:f.tax,asOf:f.perfAt?fmtDate(f.perfAt):"",summary:f.pol?"นโยบาย: "+f.pol:"",fetchedAt:(FDB.updated||"").slice(0,10),src:"ก.ล.ต."};
}
function fundLine(f){
  const mine=myAgentsFor(f);

function candidateList(assets,perClass=7){
  if(!FDB)return "";
  const mine=mineIdxSet();
  return assets.map(a=>{
    let L=FDB.funds.filter(f=>f.a===a&&!f.tax&&f.ter!=null&&f.r["1y"]!=null);
    const seasoned=L.filter(f=>f.r["3y"]!=null);if(seasoned.length>=5)L=seasoned;
    if(mine.size){const m=L.filter(f=>f.sa.some(i=>mine.has(i)));if(m.length>=3)L=m;}
    L.sort((x,y)=>x.ter-y.ter);
    return `[${assetLabel(a)}]\n`+L.slice(0,perClass).map(f=>"- "+fundLine(f)).join("\n");
  }).join("\n");
}

function computePortfolio(){
  const items=getHoldings().map(h=>{const pl=h.value-h.invested;return {...h,pl,plPct:h.invested>0?pl/h.invested*100:0};});
  const totalValue=items.reduce((s,i)=>s+i.value,0);
  const totalInv=items.reduce((s,i)=>s+i.invested,0);
  const totalPL=totalValue-totalInv;
  const oldest=items.reduce((o,i)=>(!o||(i.updatedAt&&i.updatedAt<o))?i.updatedAt:o,null);
  return {items:items.sort((a,b)=>b.value-a.value),totalValue,totalInv,totalPL,totalPLPct:totalInv>0?totalPL/totalInv*100:0,oldest};
}
/* กองทุนผสมนับเป็นหุ้นไทย 50% + ตราสารหนี้ 50% เพื่อเทียบกับเป้าหมาย */
function effectiveAlloc(items){
  const m={};
  items.forEach(i=>{
    if(i.asset==="mixed"){m.th_equity=(m.th_equity||0)+i.value/2;m.bond=(m.bond||0)+i.value/2;}
    else m[i.asset]=(m[i.asset]||0)+i.value;
  });
  return m;
}
function rebalanceRows(extra=0){
  const port=computePortfolio(), tgt=targetAlloc(), cur=effectiveAlloc(port.items);
  const total=port.totalValue+extra;
  const keys=[...new Set([...Object.keys(tgt),...Object.keys(cur)])];
  const rows=keys.map(k=>{
    const c=cur[k]||0,t=tgt[k]||0,tv=total*t/100;
    return {asset:k,current:c,curPct:port.totalValue>0?c/port.totalValue*100:0,target:t,targetValue:tv,diff:tv-c,buy:0};
  });
  if(extra>0){
    const sum=rows.filter(r=>r.diff>0).reduce((s,r)=>s+r.diff,0);
    rows.forEach(r=>{r.buy=r.diff>0&&sum>0?extra*r.diff/sum:0;});
  }
  return rows.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
}

function buildAlerts(){
  const port=computePortfolio(), s=getSettings(), out=[];
  if(!port.items.length)return out;
  rebalanceRows().forEach(r=>{
    const d=r.curPct-r.target;
    if(Math.abs(d)<DRIFT)return;
    if(d>0)out.push({c:"var(--amber)",t:`${assetLabel(r.asset)} เกินเป้า ${Math.round(d)}%`,s:`ถืออยู่ ${Math.round(r.curPct)}% เป้า ${r.target}% · ควรลดราว ${baht(-r.diff)}`});
    else out.push({c:"var(--teal)",t:`${assetLabel(r.asset)} ต่ำกว่าเป้า ${Math.round(-d)}%`,s:`ถืออยู่ ${Math.round(r.curPct)}% เป้า ${r.target}% · ควรเพิ่มราว ${baht(r.diff)}`});
  });
  port.items.forEach(i=>{if(i.invested>0&&i.plPct<=-s.lossAlert)out.push({c:"var(--red)",t:`${i.code} ขาดทุน ${Math.abs(Math.round(i.plPct))}%`,s:`เกินระดับเตือน ${s.lossAlert}% ที่ตั้งไว้ · ลองให้ AI ช่วยดูว่าควรถือต่อหรือไม่`});});
  if(port.oldest==="2000-01-01")out.push({c:"var(--amber)",t:"ตรวจมูลค่าพอร์ตอีกครั้ง",s:"ย้ายข้อมูลจากเวอร์ชันเดิมแล้ว แต่มูลค่าเดิมคำนวณจาก NAV ตัวอย่าง · กด ✏️ แก้มูลค่า หรือ 📸 อัปเดตจากภาพ"});
  else if(daysSince(port.oldest)>STALE_DAYS)out.push({c:"var(--text3)",t:"มูลค่าพอร์ตไม่ได้อัปเดตนาน",s:`บางกองอัปเดตล่าสุด ${fmtDate(port.oldest)} · แคปหน้าจอพอร์ตจากแอปธนาคารเพื่ออัปเดตได้`});
  const u=monthUsage();
  if(s.budget>0&&u.thb>=s.budget*0.8)out.push({c:"var(--amber)",t:"ค่า AI ใกล้ครบวงเงินเดือนนี้",s:`ใช้ไป ${baht(u.thb)} จาก ${baht(s.budget)}`});
  return out;
}

function recordSnapshot(){
  const p=computePortfolio();
  if(!p.items.length||p.oldest==="2000-01-01")return;
  const h=LS.get(K.hist,[]), e={d:todayStr(),v:Math.round(p.totalValue),i:Math.round(p.totalInv),c:Math.round(netFlow())};
  if(h.length&&h[h.length-1].d===e.d)h[h.length-1]=e;else h.push(e);
  LS.set(K.hist,h.slice(-500));
}
const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
/* ผลตอบแทนถ่วงน้ำหนักด้วยเงิน (Modified Dietz) จากประวัติมูลค่า: ตัดผลของเงินที่เติม/ถอนออก */
function portPerf(){
  const h=LS.get(K.hist,[]);if(h.length<2)return null;
  const a=h[0],b=h[h.length-1],T=dayDiff(a.d,b.d);
  if(T<7)return null;
  let sumF=0,wF=0;
  for(let k=1;k<h.length;k++){
    const F=(h[k].c??h[k].i)-(h[k-1].c??h[k-1].i);if(!F)continue;
    sumF+=F;wF+=F*(T-dayDiff(a.d,h[k].d))/T;
  }
  const denom=a.v+wF;if(denom<=0)return null;
  const ret=(b.v-a.v-sumF)/denom;
  return {ret:ret*100,ann:T>=365?(Math.pow(1+ret,365/T)-1)*100:null,days:T,since:a.d,gain:b.v-a.v-sumF};
}
function growthChart(h){
  if(!h||h.length<2)return "";
  const W=320,H=92,px=5,py=9,t0=+parseD(h[0].d),t1=+parseD(h[h.length-1].d);
  const vals=h.flatMap(e=>[e.v,e.i]),mn=Math.min(...vals),mx=Math.max(...vals),pad=((mx-mn)||mx*0.1||1)*0.14;
  const X=d=>px+(W-2*px)*((+parseD(d)-t0)/((t1-t0)||1)), Y=v=>py+(H-2*py)*(1-(v-(mn-pad))/((mx-mn)+2*pad));
  const line=k=>h.map((e,i)=>(i?"L":"M")+X(e.d).toFixed(1)+" "+Y(e[k]).toFixed(1)).join(" ");
  const lv=line("v"),last=h[h.length-1];
  return `<div class="gchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟมูลค่าพอร์ตเทียบเงินต้น">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFCB7E" stop-opacity=".3"/><stop offset="1" stop-color="#EFCB7E" stop-opacity="0"/></linearGradient></defs>
    <path d="${lv} L${X(last.d).toFixed(1)} ${H} L${X(h[0].d).toFixed(1)} ${H} Z" fill="url(#ga)"/>
    <path d="${line("i")}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="${lv}" fill="none" stroke="#EFCB7E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last.d).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="3.2" fill="#EFCB7E"/></svg>
    <div class="small" style="display:flex;justify-content:space-between;margin-top:2px;padding:0 4px"><span>${fmtDate(h[0].d)}</span><span><span class="gold">▬</span> มูลค่า&nbsp;&nbsp;<span style="opacity:.7">┄</span> เงินต้น</span><span>${fmtDate(last.d)}</span></div></div>`;
}

function applyTx(code,type,amount,date,newVal){
  let hs=getHoldings(),h=hs.find(x=>x.code===code);
  if(!h){
    if(type==="sell")return false;
    const f=dbFund(code);
    h={id:uid(),code,name:f?(f.th||f.en):"",asset:f?fAsset(f):"mixed",invested:0,value:0,updatedAt:todayStr()};hs.push(h);
  }
  if(type==="buy"){h.invested+=amount;h.value=newVal>0?newVal:h.value+amount;}
  else{const frac=h.value>0?Math.min(1,amount/h.value):1;h.invested=Math.max(0,h.invested*(1-frac));h.value=newVal>0?newVal:Math.max(0,h.value-amount);}
  h.updatedAt=todayStr();
  if(type==="sell"&&h.value<1)hs=hs.filter(x=>x!==h);
  addTx({date:date||todayStr(),code,type,amount});
  setHoldings(hs);return true;
}

const medCache=new Map();
function medianTer(f){
  if(!FDB)return null;
  const key=f.a+"|"+(f.tax?"t":"n");
  if(!medCache.has(key)){
    const a=FDB.funds.filter(x=>x.a===f.a&&!!x.tax===!!f.tax&&x.ter!=null).map(x=>x.ter).sort((x,y)=>x-y);
    medCache.set(key,a.length>=8?a[Math.floor(a.length/2)]:null);
  }
  return medCache.get(key);
}
/* แพ้ค่าเฉลี่ยกลุ่มเดียวกัน (จาก factsheet) ทั้งระยะกลางและยาว */
function lagInfo(f){
  const d=k=>f.r[k]!=null&&f.pg[k]!=null?f.r[k]-f.pg[k]:null;
  const d1=d("1y"),d3=d("3y"),d5=d("5y");
  if(d3!=null&&d5!=null)return d3<0&&d5<0?{per:"3 และ 5 ปี",k:"5y",gap:d5}:null;
  if(d1!=null&&d3!=null)return d1<0&&d3<0?{per:"1 และ 3 ปี",k:"3y",gap:d3}:null;
  return null;
}
function freeCheck(port){
  port=port||computePortfolio();
  const tot=port.totalValue, checks=[], rows=port.items.map(i=>({i,f:dbFund(i.code)}));
  const dr=rebalanceRows().filter(r=>Math.abs(r.curPct-r.target)>=DRIFT);
  checks.push({ok:!dr.length,t:"สัดส่วนตรงกับเป้าหมาย",d:dr.length?dr.slice(0,3).map(r=>`${assetLabel(r.asset)} ${r.curPct>r.target?"เกิน":"ขาด"} ${Math.round(Math.abs(r.curPct-r.target))}%`).join(" · "):`ทุกประเภทอยู่ในช่วง ±${DRIFT}% ของเป้า`,act:dr.length?["ดูแผนปรับสมดุล","setHomeTab('overview','rebal')"]:null});

  checks.push(wter==null?{ok:null,t:"ค่าธรรมเนียม",d:FDB?"ไม่พบกองในพอร์ตในคลัง ก.ล.ต. จึงประเมินไม่ได้":"ยังโหลดคลังกองทุนไม่ได้"}
    :{ok:!pricey.length,t:"ค่าธรรมเนียมอยู่ในเกณฑ์",d:pricey.length?`${pricey.map(x=>x.i.code).join(", ")} แพงกว่าค่ากลางของกองประเภทเดียวกัน`:`เฉลี่ย ${wter.toFixed(2)}% ต่อปี ไม่มีกองที่แพงกว่าค่ากลางของประเภทเดียวกันมาก`});
  const cmp=rows.filter(x=>x.f&&(x.f.pg["3y"]!=null||x.f.pg["1y"]!=null)), lag=cmp.map(x=>({...x,lag:lagInfo(x.f)})).filter(x=>x.lag);
  checks.push(!cmp.length?{ok:null,t:"ผลงานเทียบกองประเภทเดียวกัน",d:"ยังไม่มีข้อมูลเปรียบเทียบของกองในพอร์ต"}
    :{ok:!lag.length,t:"ผลงานไม่แพ้ค่าเฉลี่ยกลุ่ม",d:lag.length?`${lag.map(x=>x.i.code).join(", ")} ให้ผลตอบแทนต่ำกว่าค่าเฉลี่ยกลุ่มต่อเนื่อง`:"ไม่มีกองที่แพ้ค่าเฉลี่ยกลุ่มต่อเนื่อง"});
  const top=port.items[0], share=tot>0&&top?top.value/tot*100:0;
  checks.push(port.items.length<2?{ok:null,t:"การกระจายการลงทุน",d:"มีกองทุนเดียว การกระจายขึ้นกับนโยบายของกองนั้น"}
    :{ok:share<=50,t:"ไม่กระจุกในกองเดียว",d:share>50?`${top.code} คิดเป็น ${Math.round(share)}% ของพอร์ต`:`กองใหญ่สุด ${top.code} คิดเป็น ${Math.round(share)}% ของพอร์ต`});
  const stale=port.oldest==="2000-01-01"||daysSince(port.oldest)>STALE_DAYS;
  checks.push({ok:!stale,t:"ข้อมูลพอร์ตเป็นปัจจุบัน",d:stale?"มูลค่าบางกองไม่ได้อัปเดตนานเกิน "+STALE_DAYS+" วัน":"อัปเดตล่าสุด "+fmtDate(port.oldest),act:stale?["อัปเดตมูลค่า","showBulkUpdate()"]:null});
  const rated=checks.filter(c=>c.ok!==null);

  const old=LS.get("fp_holdings",null);
  if(Array.isArray(old)&&old.length&&!LS.get(K.holdings,null)){
    const funds=LS.get("fp_funds",[])||[];
    setHoldings(old.map(h=>{
      const f=funds.find(x=>x.code===h.code)||{};
      const inv=Math.round((h.units||0)*(h.avgCost||0));

    }));
  }
  LS.set(K.migrated,true);
}

let sheetHist=false, skipPop=0, pendingBack=null;
function showSheet(html){
  let o=$("overlay");
  if(!o){
    o=document.createElement("div");o.className="overlay";o.id="overlay";
    o.addEventListener("click",e=>{if(e.target===o)closeSheet();});
    document.body.appendChild(o);document.body.style.overflow="hidden";
    if(pendingBack){clearTimeout(pendingBack);pendingBack=null;}   /* ปิดแล้วเปิดใหม่ทันที: ใช้ประวัติเดิมต่อ */
    else{try{history.pushState({sheet:1},"");sheetHist=true;}catch{}}
  }
  o.innerHTML=`<div class="sheet" id="sheet"><div class="sheethead" id="sheethead"><div class="handle"></div><button class="sheetx" aria-label="ปิด" onclick="closeSheet()">✕</button></div>${html}</div>`;
  const sh=$("sheet"),hd=$("sheethead");let y0=null,dy=0;
  hd.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0;sh.classList.add("drag");},{passive:true});
  hd.addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`;},{passive:true});
  hd.addEventListener("touchend",()=>{sh.classList.remove("drag");if(dy>70)closeSheet();else sh.style.transform="";y0=null;});
}
function closeSheet(fromPop){
  const o=$("overlay");if(!o)return;
  o.remove();document.body.style.overflow="";
  if(fromPop===true){sheetHist=false;return;}
  if(sheetHist&&!pendingBack)pendingBack=setTimeout(()=>{pendingBack=null;if(!sheetHist)return;sheetHist=false;skipPop=1;try{history.back();}catch{skipPop=0;}setTimeout(()=>{skipPop=0;},800);},0);
}
window.addEventListener("popstate",()=>{if(skipPop>0){skipPop--;return;}if($("overlay")){sheetHist=false;closeSheet(true);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("overlay"))closeSheet();});
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2400);}
function downloadFile(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

function donut(parts,center,sub){
  const R=44,C=2*Math.PI*R;let off=0;
  const segs=parts.filter(p=>p.pct>0.2).map(p=>{const len=C*p.pct/100,s=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${p.color}" stroke-width="15" stroke-dasharray="${Math.max(0,len-1.6).toFixed(2)} ${(C-Math.max(0,len-1.6)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=len;return s;}).join("");
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="สัดส่วนสินทรัพย์"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--bg3)" stroke-width="15"/>${segs}<text x="60" y="59" text-anchor="middle" font-size="19" font-weight="700" fill="var(--text)">${center}</text><text x="60" y="76" text-anchor="middle" font-size="10.5" fill="var(--text3)">${sub}</text></svg>`;
}
function viewAllocation(port){
  const eff=effectiveAlloc(port.items), tgt=targetAlloc();
  const keys=[...new Set([...Object.keys(tgt),...Object.keys(eff)])].sort((a,b)=>(eff[b]||0)-(eff[a]||0));
  const hasMixed=port.items.some(i=>i.asset==="mixed");
  const P=k=>port.totalValue>0?(eff[k]||0)/port.totalValue*100:0;
  const held=keys.filter(k=>P(k)>0);
  return `<div class="alloc">${donut(held.map(k=>({pct:P(k),color:assetColor(k)})),port.items.length,"กองทุน")}
      <div class="lg">${held.map(k=>`<div><i style="background:${assetColor(k)}"></i><span>${assetLabel(k)}</span><b>${Math.round(P(k))}%</b></div>`).join("")}</div></div>
    <div class="hr"></div>`+keys.map(k=>{
    const p=P(k), t=tgt[k]||0, d=p-t;
    const flag=Math.abs(d)>=DRIFT?` <span class="tag ${d>0?"a":"t"}">${d>0?"เกิน":"ขาด"} ${Math.round(Math.abs(d))}%</span>`:"";
    return `<div class="arow"><div class="atop"><span class="aname">${assetLabel(k)}${flag}</span><span class="apct">${Math.round(p)}% <span style="color:var(--text3);font-weight:500">/ เป้า ${t}%</span></span></div>
      <div class="track"><div class="fill" style="width:${Math.min(p,100)}%;background:${assetColor(k)}"></div>${t?`<div class="tmark" style="left:calc(${Math.min(t,100)}% - 1px)"></div>`:""}</div></div>`;
  }).join("")+`<div class="small" style="margin-top:12px">ขีดแนวตั้งคือเป้าหมายตามโปรไฟล์ ${profileLabel()}${hasMixed?" · กองทุนผสมนับเป็นหุ้นไทยและตราสารหนี้อย่างละครึ่ง":""}</div>`;
}
function viewRebalance(extra){

}

function filterFunds(){
  const q=FSTATE.q.trim().toLowerCase(), mine=FSTATE.mine?mineIdxSet():null;
  let L=FDB.funds.filter(f=>{
    if(q&&!f.s.includes(q))return false;
    if(FSTATE.a!=="all"&&f.a!==FSTATE.a)return false;
    if(FSTATE.r!=="all"){const r=f.rs||0;if(FSTATE.r==="low"&&!(r>=1&&r<=3))return false;if(FSTATE.r==="mid"&&!(r>=4&&r<=5))return false;if(FSTATE.r==="high"&&r<6)return false;}
    if(FSTATE.t==="none"&&f.tax)return false;
    if(FSTATE.t!=="all"&&FSTATE.t!=="none"&&f.tax!==FSTATE.t&&f.taxCls!==FSTATE.t)return false;
    if(mine&&mine.size&&!f.sa.some(i=>mine.has(i)))return false;
    return true;
  });
  const key={r1y:"1y",r3y:"3y",r5y:"5y"}[FSTATE.sort];
  if(key)L.sort((a,b)=>(b.r[key]??-1e9)-(a.r[key]??-1e9));
  else if(FSTATE.sort==="ter")L.sort((a,b)=>(a.ter??1e9)-(b.ter??1e9));
  else L.sort((a,b)=>a.c.localeCompare(b.c));
  if(q){const ex=L.filter(f=>f.c.toLowerCase()===q||f.cls.some(c=>c.toLowerCase()===q));if(ex.length)L=ex.concat(L.filter(f=>!ex.includes(f)));}
  return L;
}

  else{const b=$("fd-cmp");if(b)b.textContent=CMP.includes(i)?"✓ อยู่ในรายการเทียบ":"＋ เพิ่มในรายการเทียบ";drawCmpBar();}

function drawCmpBar(){

function showCompare(){
  if(CMP.length<2){toast("เลือกอย่างน้อย 2 กองเพื่อเปรียบเทียบ");return;}
  const F=CMP.map(i=>FDB.funds[i]);
  const best=(vals,hi)=>{const v=vals.filter(x=>x!=null);if(v.length<2)return null;return hi?Math.max(...v):Math.min(...v);};
  const row=(label,vals,fmt,hi)=>{const b=hi===undefined?null:best(vals,hi);return `<tr><td>${label}</td>${vals.map(v=>`<td class="${b!=null&&v===b?"best":""}">${v==null?"-":fmt(v)}</td>`).join("")}</tr>`;};
  const grp=t=>`<tr class="grp"><td colspan="${F.length+1}">${t}</td></tr>`;
  const p=v=>pctN(v), n=v=>v+"%";
  showSheet(`<h3>เปรียบเทียบกองทุน</h3>
    <div class="ctw"><table class="ctab">
      <tr><th></th>${F.map(f=>`<th><span class="link" onclick="showFundDB(${f.i})">${esc(f.c)}</span></th>`).join("")}</tr>
      ${row("ประเภท",F.map(f=>assetLabel(f.a)),v=>v)}
      ${row("ความเสี่ยง",F.map(f=>f.rs),v=>riskTxt(v))}
      ${row("ลดหย่อนภาษี",F.map(f=>f.tax||(f.taxCls?"มีชนิด "+f.taxCls:"ไม่ใช่")),v=>v)}
      ${grp("ผลตอบแทนต่อปี")}

/* ── ช่องทางที่ขาย: ใช้ข้อมูลผู้ขายในคลัง (ถ้ามี) ไม่งั้นให้ AI ค้นทีละกองแล้วจำไว้ 30 วัน ── */
const SELLER_KEY="fp2_sellers";
const normB=s=>String(s||"").toLowerCase().replace(/\(มหาชน\)|จำกัด|บริษัท|หลักทรัพย์|ธนาคาร|บล\.|บลจ\.|ธ\.|securities|bank|public|company|limited|co\.|ltd\.?|pcl\.?|[\s.,()\-]/g,"");
const sameB=(a,b)=>{a=normB(a);b=normB(b);return !!a&&!!b&&(a.includes(b)||b.includes(a));};
function sellerCache(code){const c=LS.get(SELLER_KEY,{})[code];return c&&daysSince(c.date)<30?c:null;}
function viewSellers(f){
  const mb=getSettings().myBrokers||[];
  if(FDB.agents.length&&f.sa.length){
    const mineNames=myAgentsFor(f);
    return (mb.length?(mineNames.length?`<div class="banner info" style="cursor:default">✅ ซื้อผ่านช่องทางของคุณได้: ${mineNames.map(esc).join(", ")}</div>`:`<div class="banner warn" style="cursor:default">ไม่มีขายผ่านช่องทางที่คุณตั้งไว้</div>`):"")+
      `<details><summary>ผู้สนับสนุนการขายทั้งหมด (${f.sa.length} ราย)</summary><div style="margin-top:8px">${f.sa.map(a=>`<div class="agent">${mineNames.includes(FDB.agents[a])?"✅":"•"} ${esc(FDB.agents[a])}</div>`).join("")}</div></details>`;
  }
  const c=sellerCache(f.c);
  let h=`<div class="muted" style="margin-bottom:10px">ซื้อตรงกับ <b style="color:var(--text)">${esc(f.amc)}</b> ได้เสมอ ผ่านเว็บ/แอปของ บลจ. หรือธนาคารในเครือ</div>`;
  if(!c)return h+`<button class="btn gho full" id="fd-sbtn" onclick="lookupSellers(${f.i})">🔎 ให้ AI ค้นว่าซื้อได้ที่ไหนบ้าง <span class="cost">≈ ฿1–3</span></button>`;
  const match=c.channels.filter(ch=>mb.some(m=>sameB(m,ch)));
  return h+(mb.length?(match.length?`<div class="banner info" style="cursor:default">✅ น่าจะซื้อผ่านช่องทางของคุณได้: ${match.map(esc).join(", ")}</div>`:`<div class="banner warn" style="cursor:default">ไม่พบช่องทางของคุณในรายชื่อที่ค้นได้</div>`):"")+
    `<div style="display:flex;gap:6px;flex-wrap:wrap">${c.channels.map(ch=>`<span class="tag ${match.includes(ch)?"g":""}">${esc(ch)}</span>`).join("")}</div>
    ${c.note?`<div class="small" style="margin-top:8px">${esc(c.note)}</div>`:""}
    <div class="cost" style="margin-top:6px">AI ค้นเมื่อ ${fmtDate(c.date)} · ควรยืนยันในแอปที่จะซื้อ · <span class="link" onclick="lookupSellers(${f.i},true)">ค้นใหม่</span></div>`;
}
async function lookupSellers(i,force){
  const f=FDB.funds[i];if(!f)return;
  if(!force&&sellerCache(f.c)){$("fd-sellers").innerHTML=viewSellers(f);return;}
  const box=$("fd-sellers");box.innerHTML=loadingBox("กำลังค้นช่องทางที่ขาย "+esc(f.c)+"...");
  const sys=`ค้นจากเว็บว่ากองทุนรวมไทยรหัส "${f.c}" (${f.th||f.en}, บลจ.${f.amc}) ซื้อได้ผ่านช่องทางใดบ้าง เช่น ธนาคาร บริษัทหลักทรัพย์ แพลตฟอร์ม/แอปซื้อขายกองทุน ใช้การค้นไม่เกิน 2 ครั้ง ใส่เฉพาะช่องทางที่พบหลักฐาน ใช้ชื่อสั้นที่คนทั่วไปเรียก
ตอบเป็น JSON ภายในแท็ก <JSON></JSON> เท่านั้น: {"channels":["ชื่อช่องทาง"],"note":"ข้อสังเกตสั้นๆ 1 ประโยค ถ้ามี"}`;
  try{
    const {text,cost}=await callClaude({system:sys,max_tokens:1200,search:true,messages:[{role:"user",content:"กองทุน "+f.c}]});
    const j=extractJSON(text);
    const all=LS.get(SELLER_KEY,{});all[f.c]={channels:(j.channels||[]).map(x=>String(x).trim()).filter(Boolean).slice(0,30),note:j.note||"",date:todayStr()};LS.set(SELLER_KEY,all);
    box.innerHTML=viewSellers(f)+`<div class="cost">${costTxt(cost)}</div>`;
  }catch(e){box.innerHTML=errBox(e);}
}

asset ต้องเป็นหนึ่งใน: ${ASSET_GUIDE}
ตอบเป็น JSON ภายในแท็ก <JSON></JSON> เท่านั้น:
{"found":true|false,"code":"รหัสที่ถูกต้อง","name":"ชื่อกองทุน","amc":"บลจ.","asset":"คีย์ประเภท","risk":ระดับ1-8หรือnull,"fee":ค่าใช้จ่ายรวมต่อปี(%)หรือnull,"taxType":"RMF|ThaiESG|ThaiESGX|SSF|null","return1y":ผลตอบแทนย้อนหลัง1ปี(%)หรือnull,"asOf":"วันที่ของข้อมูลถ้าทราบ","summary":"นโยบายลงทุนสั้นๆ 1-2 ประโยค"}`;
  const {text,cost}=await callClaude({system:sys,max_tokens:1500,search:true,messages:[{role:"user",content:"กองทุนรหัส "+code}]});
  const j=extractJSON(text);
  if(!j.found)return {info:null,cost};
  const info={...j,code:String(j.code||code).toUpperCase(),asset:ASSET[j.asset]?j.asset:"mixed",taxType:j.taxType&&j.taxType!=="null"?j.taxType:null,fetchedAt:todayStr()};
  const all=getInfo();all[code]=info;if(info.code!==code)all[info.code]=info;LS.set(K.info,all);
  return {info,cost};
}

function saveHolding(id){
  const code=$("hf-code").value.trim().toUpperCase();
  const inv=num($("hf-inv").value); let val=num($("hf-val").value);
  if(!code){$("hf-err").textContent="กรุณาใส่รหัสกองทุน";return;}
  if(inv<=0){$("hf-err").textContent="กรุณาใส่เงินที่ลงไป";return;}
  if(val<=0)val=inv;
  let hs=getHoldings();
  const rec={code,name:$("hf-name").value.trim(),asset:$("hf-asset").value,invested:inv,value:val,updatedAt:todayStr()};
  if(id){
    const old=hs.find(x=>x.id===id);
    if(old&&Math.round(inv-old.invested)!==0)addTx({code,type:"adj",amount:Math.round(inv-old.invested)});
    hs=hs.map(x=>x.id===id?{...x,...rec}:x);
  }else{
    const ex=hs.find(x=>x.code===code);
    if(ex&&!confirm(code+" มีในพอร์ตแล้ว ต้องการรวมยอดเข้าด้วยกันไหม?"))return;
    addTx({code,type:ex?"buy":"open",amount:inv});
    if(ex)hs=hs.map(x=>x.id===ex.id?{...x,...rec,invested:x.invested+inv,value:x.value+val}:x);
    else hs.push({id:uid(),...rec});
  }
  setHoldings(hs);closeSheet();render();toast("บันทึก "+code+" แล้ว");
}
function deleteHolding(id){
  const h=getHoldings().find(x=>x.id===id);if(!h)return;
  if(!confirm("ลบ "+h.code+" ออกจากพอร์ต?"))return;

function fileToJpegB64(file,max=1568){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.88).split(",")[1]);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("อ่านไฟล์ภาพไม่ได้"));};
    img.src=url;
  });
}

/* ════════════ PLAN ════════════ */
/* กฎลดหย่อนปีภาษี 2569 (ตรวจเมื่อ พ.ย. 2569): RMF 30% ของเงินได้ รวมกองทุนเกษียณอื่นไม่เกิน 500,000
   ThaiESG + ThaiESGX เงินใหม่ รวมกัน 30% ไม่เกิน 300,000 · SSF หมดสิทธิลดหย่อนสำหรับเงินซื้อใหม่ตั้งแต่ปี 2568 */
const TAX={year:2569,pct:30,rmfCap:500000,esgCap:300000,checked:"พ.ย. 2569"};
const beYear=()=>new Date().getFullYear()+543;
function getTax(){const t={RMF:0,ThaiESG:0,PVD:0,...LS.get(K.tax,{})};if(t.THAIESG&&!t.ThaiESG)t.ThaiESG=t.THAIESG;return t;}
function taxCalc(){
  const t=getTax(), s=getSettings(), inc=num(s.income), byInc=inc>0?inc*TAX.pct/100:Infinity;
  const rmfLimit=Math.max(0,Math.min(byInc,TAX.rmfCap-t.PVD)), esgLimit=Math.min(byInc,TAX.esgCap);
  const rmfUse=Math.min(t.RMF,rmfLimit), esgUse=Math.min(t.ThaiESG,esgLimit);
  return {t,inc,rmfLimit,esgLimit,rmfUse,esgUse,deduct:rmfUse+esgUse,save:(rmfUse+esgUse)*s.taxRate/100,rmfLeft:Math.max(0,rmfLimit-t.RMF),esgLeft:Math.max(0,esgLimit-t.ThaiESG),over:t.RMF>rmfLimit||t.ThaiESG>esgLimit};
}
const SD_ASSUMP={conservative:4,moderate:7,balanced:9,aggressive:13};
function goalPlan(g){
  const model=(getProfile()||{}).model||"moderate",ret=RETURN_ASSUMP[model];
  const r=ret/100/12,n=Math.max(1,Math.round(g.years*12));
  const fvCur=(g.current||0)*Math.pow(1+r,n), need=g.target-fvCur;
  const pmt=need<=0?0:need*r/(Math.pow(1+r,n)-1);
  return {pmt,ret};
}
/* จำลอง 400 เส้นทางด้วยผลตอบแทนที่ผันผวนตามโปรไฟล์ → ช่วงผลลัพธ์และโอกาสถึงเป้า (ผลคงที่ต่อเป้าหมาย) */
function seeded(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const simCache=new Map();
function simGoal(g){
  const model=(getProfile()||{}).model||"moderate", mu=RETURN_ASSUMP[model]/100, sd=SD_ASSUMP[model]/100;
  const hasSave=g.saving!=null&&g.saving!=="", save=hasSave?num(g.saving):goalPlan(g).pmt, n=Math.max(1,Math.round(g.years*12));
  const key=[model,g.target,g.current||0,Math.round(save),n].join("|");
  if(simCache.has(key))return simCache.get(key);
  let s=7;for(const ch of String(g.id||g.name))s=(s*31+ch.charCodeAt(0))|0;
  const R=seeded(s), N=400, out=[], mm=mu/12, ms=sd/Math.sqrt(12);
  for(let p=0;p<N;p++){
    let v=g.current||0;
    for(let m=0;m<n;m++){const z=Math.sqrt(-2*Math.log(R()||1e-9))*Math.cos(2*Math.PI*R());v=Math.max(0,v*(1+mm+ms*z))+save;}
    out.push(v);
  }
  out.sort((a,b)=>a-b);
  const r={p10:out[Math.floor(N*.1)],p50:out[Math.floor(N*.5)],p90:out[Math.floor(N*.9)],prob:out.filter(v=>v>=g.target).length/N*100,save,hasSave,sd:SD_ASSUMP[model]};
  simCache.set(key,r);return r;
}
function dcaDone(d){const m=monthKey();return getTx().some(t=>t.type==="buy"&&t.code===d.code&&t.date.slice(0,7)===m);}
function dcaBuy(id){
  const d=LS.get(K.dca,[]).find(x=>x.id===id);if(!d)return;
  applyTx(d.code,"buy",num(d.amount),todayStr(),0);
  render();toast("บันทึกซื้อ "+d.code+" "+baht(num(d.amount))+" แล้ว");
}
function viewGoal(g){

    <div class="small" style="margin-top:8px">แอปเตือนเมื่อสัดส่วนเบี่ยงจากเป้าเกิน ±${DRIFT}% ด้วย · แจ้งเตือนจะเห็นเมื่อเปิดแอป</div>
  </div>

  <div class="sec"><span class="ic">🏦</span>ช่องทางซื้อกองทุนของฉัน</div>
  <div class="card">
    ${(s.myBrokers||[]).length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${s.myBrokers.map(n=>`<span class="tag p">${esc(n)}</span>`).join("")}</div>`:`<div class="muted" style="margin-bottom:10px">ยังไม่ได้ตั้ง — บอกว่ามีบัญชีกับธนาคาร/โบรกเกอร์ไหน แอปและ AI จะเลือกกองที่ซื้อผ่านช่องทางของคุณได้</div>`}
    <button class="btn gho full" onclick="showBrokerPicker()">${(s.myBrokers||[]).length?"แก้ไขช่องทาง":"＋ เลือกช่องทางของฉัน"}</button>
  </div>

  <div class="sec"><span class="ic">🗂️</span>คลังกองทุน (ก.ล.ต.)</div>
  <div class="card">
    ${fdbState==="ok"?`<div class="kv"><span>จำนวนกองทุน</span><span>${FDB.funds.length.toLocaleString()} กอง</span></div><div class="kv"><span>ผู้สนับสนุนการขาย</span><span>${FDB.agents.length.toLocaleString()} ราย</span></div><div class="kv"><span>อัปเดตล่าสุด</span><span>${fmtDate((FDB.updated||"").slice(0,10))}</span></div>`
      :`<div class="muted">${fdbState==="missing"?"ยังไม่มีข้อมูล — รอระบบดึงข้อมูลรอบแรก":"กำลังโหลด..."}</div>`}
    <div class="small" style="margin-top:8px">อัปเดตอัตโนมัติวันที่ 2 ของทุกเดือน ผ่าน GitHub Actions · ไม่เสียค่า AI</div>
  </div>

  <div class="sec"><span class="ic">👤</span>โปรไฟล์ความเสี่ยง</div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:16px;font-weight:700;color:var(--accent2)">${profileLabel()}</div><div class="small">ประเมินเมื่อ ${fmtDate(p.createdAt)}</div></div><button class="mini" onclick="if(confirm('ทำแบบประเมินความเสี่ยงใหม่?')){LS.del(K.profile);setupAns=[];render();}">ประเมินใหม่</button></div></div>

  <div class="sec"><span class="ic">💾</span>สำรองและย้ายข้อมูล</div>
  <div class="card">
    <div class="muted" style="margin-bottom:10px">ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้ ส่งออกไฟล์ไว้เป็นระยะ และนำเข้าเพื่อย้ายไปมือถือ/คอมอีกเครื่อง (ไฟล์ไม่มี API key)</div>
    <div class="row"><button class="btn gho flex" onclick="exportData()">⬇️ ส่งออก</button><button class="btn gho flex" onclick="const f=$('file-json');f.value='';f.click()">⬆️ นำเข้า</button></div>
  </div>

  <div class="sec"><span class="ic">ℹ️</span>เกี่ยวกับ</div>
  <div class="card"><div class="small" style="line-height:1.7"><b style="color:var(--text)">FundPlan</b> เป็นเครื่องมือติดตามและวางแผนพอร์ต ไม่ใช่ช่องทางซื้อขาย · ข้อมูลกองทุนในคลังมาจาก ก.ล.ต. (SEC Open Data) ส่วนข้อมูลที่ AI ค้นจากเว็บอาจคลาดเคลื่อน ควรตรวจกับหนังสือชี้ชวนหรือเว็บ บลจ. ก่อนตัดสินใจ<br><span style="color:var(--amber)">การลงทุนมีความเสี่ยง คำแนะนำจาก AI ใช้ประกอบการตัดสินใจเท่านั้น</span></div></div>
  <button class="btn dan full" onclick="resetAll()">🗑️ ล้างข้อมูลทั้งหมด</button>`;
}
function saveKey(){const k=$("api-key").value.trim();LS.set(K.key,k);render();toast(k?"✅ บันทึก API key แล้ว":"ลบ API key แล้ว");}
const BACKUP_KEYS=["profile","holdings","info","goals","dca","tax","settings","check","starter","chat","sellers","tx","hist"];
function exportData(){
  const data={};BACKUP_KEYS.forEach(k=>data[k]=LS.get(K[k],null));
  downloadFile("fundplan-backup-"+todayStr()+".json",JSON.stringify({app:"FundPlan",version:2,exportedAt:new Date().toISOString(),data},null,1),"application/json");
  toast("⬇️ ส่งออกแล้ว");
}
async function importData(file){
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=="FundPlan"||!j.data)throw new Error("ไม่ใช่ไฟล์สำรองของ FundPlan");
    if(!confirm("นำเข้าข้อมูลจากไฟล์นี้? ข้อมูลปัจจุบันในเครื่องจะถูกแทนที่"))return;
    BACKUP_KEYS.forEach(k=>{if(j.data[k]!=null)LS.set(K[k],j.data[k]);else LS.del(K[k]);});
    LS.set(K.migrated,true);if(j.data.tx==null)LS.del("fp3_migrated");migrate3();state.tab="home";state.homeTab="overview";render();toast("นำเข้าข้อมูลแล้ว");
  }catch(e){alert("นำเข้าไม่สำเร็จ: "+e.message);}
}
function resetAll(){
  if(!confirm("ล้างข้อมูลทั้งหมด? (ยกเว้น API key) แนะนำให้ส่งออกไฟล์สำรองก่อน"))return;
  BACKUP_KEYS.forEach(k=>LS.del(K[k]));LS.del(K.usage);["fp_holdings","fp_funds","fp_alertcfg","fp_dismissed"].forEach(k=>LS.del(k));
  LS.set(K.migrated,true);LS.set("fp3_migrated",true);CMP.length=0;state={tab:"home",homeTab:"overview",chatBusy:false,rbExtra:0};render();toast("ล้างข้อมูลแล้ว");
}
function downloadICS(){
  const d=nextReviewDate().replace(/-/g,""), now=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//FundPlan//TH","CALSCALE:GREGORIAN","BEGIN:VEVENT","UID:fundplan-review-"+d+"@fundplan","DTSTAMP:"+now,"DTSTART;VALUE=DATE:"+d,"SUMMARY:🩺 ตรวจสุขภาพพอร์ตกองทุน (FundPlan)","DESCRIPTION:เปิด FundPlan แล้วกด ตรวจสุขภาพพอร์ต","BEGIN:VALARM","TRIGGER:PT9H","ACTION:DISPLAY","DESCRIPTION:ถึงรอบตรวจพอร์ตกองทุนแล้ว","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  downloadFile("fundplan-review-"+nextReviewDate()+".ics",ics,"text/calendar");
  toast("📅 เปิดไฟล์เพื่อเพิ่มลงปฏิทิน");
}

/* ════════════ BOOT ════════════ */
$("file-img").addEventListener("change",e=>{const f=e.target.files[0];if(f)importScreenshot(f);});
$("file-json").addEventListener("change",e=>{const f=e.target.files[0];if(f)importData(f);});
migrate();
migrate3();
render();
loadFundDB();
</script>
